# Manual only: this workflow never runs on push or pull request. The gate for every change is the
# local check (`make check`); see CONTRIBUTING.md. Run it by hand from
# Actions → Apps → Run workflow when a hosted build is wanted.

name: Apps

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    # Xcode 26+ (iOS/tvOS/macOS 26 SDKs). Without TailscaleKit (built separately): the app builds
    # without remote access, which is what a fork gets out of the box too.
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        destination:
          - "generic/platform=iOS Simulator"
          - "generic/platform=tvOS Simulator"
          - "generic/platform=macOS"
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen
      - run: scripts/xcodegen.sh
      - name: Build (no signing)
        run: |
          set -o pipefail
          xcodebuild build -project clients/apple/Moonrise.xcodeproj -scheme Moonrise -configuration Debug \
            -destination '${{ matrix.destination }}' \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO | tail -50
