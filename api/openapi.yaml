  /v1/admin/scan:
    post:
      tags: [admin]
      operationId: scanLibrary
      summary: Scan the libraries (Scan Now)
      description: |
        `library`: that library's folders walked in full (started, not waited for). `wait=0`:
        a pass started (`full`: every folder walked), answered at once. Otherwise the server waits
        for the pass and answers what it did (diagnostic; the command line uses it).
      parameters:
        - name: library
          in: query
          schema:
            type: string
        - name: full
          in: query
          schema:
            type: string
            enum: ['0', '1', 'true', 'false']
        - name: wait
          in: query
          schema:
            type: string
            enum: ['0', '1', 'true', 'false']
      responses:
        '200':
          description: '`{started: true, library}` or `{started: true, full}`, or the pass when waited for.'
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  started:
                    type: boolean
                  library:
                    type: string
                  full:
                    type: boolean
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/scan/progress:
    get:
      tags: [admin]
      operationId: scanProgress
      summary: The scan pass now, per library (the setup screen polls it)
      responses:
        '200':
          description: The pass.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScanProgress'
              examples:
                identifying:
                  $ref: examples/admin-scan-progress.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
