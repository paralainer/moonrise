        '404':
          $ref: '#/components/responses/NotFound'
  /v1/shows/{id}/continue:
    get:
      tags: [watch state]
      operationId: showContinue
      summary: What a show's Play button plays
      description: '`resume` a started episode, `next` the one after the last watched, `first`; `item: null` when everything has been watched.'
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ShowId'
      responses:
        '200':
          description: The episode.
          content:
            application/json:
              schema:
                type: object
                required: [item, reason]
                properties:
                  item:
                    oneOf:
                      - $ref: '#/components/schemas/Item'
                      - type: 'null'
                  reason:
                    type: [string, 'null']
                    enum: [resume, next, first, null]
              examples:
                next:
                  $ref: examples/show-continue.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/continue/{id}:
    delete:
      tags: [watch state]
      operationId: hideFromContinue
      summary: Remove from Continue Watching, on every device
      description: The item's show, film collection or film stays out of the row until it is watched again. `thread` is what was hidden.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Hidden.
          content:
            application/json:
              schema:
                type: object
                required: [hidden, thread]
                properties:
                  hidden:
                    type: boolean
                    const: true
                  thread:
                    type: string
              examples:
                hidden:
                  $ref: examples/continue-hidden.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/items/{id}/subtitles:
    get:
      tags: [subtitles]
      operationId: listSubtitles
      summary: A title's subtitle tracks
      description: Embedded, sidecar, fetched and uploaded tracks, as in the playback answer, with each text track's `timing`.
      parameters:
