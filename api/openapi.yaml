  /v1/admin/match/search:
    get:
      tags: [admin]
      operationId: matchSearch
      summary: "Fix Match's search on TMDB"
      parameters:
        - name: kind
          in: query
          schema:
            type: string
            enum: [movie, tv]
            default: movie
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: year
          in: query
          schema:
            type: integer
        - name: server_posters
          in: query
          description: >-
            `1` (capability `match-posters`): candidates carry `poster_path` for
            `/v1/admin/match/poster` instead of a TMDB `poster` URL. Without it the answer is unchanged.
          schema:
            type: integer
            enum: [1]
      responses:
        '200':
          description: "TMDB's results (at most 20)."
          content:
            application/json:
              schema:
                type: object
                required: [items, total]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MatchCandidate'
                  total:
                    type: integer
              examples:
                one:
                  $ref: examples/admin-match-search.json
                serverPosters:
                  $ref: examples/admin-match-search-server-posters.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '409':
          description: The server has no TMDB key.
          content:
            text/plain:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/match/poster:
    get:
      tags: [admin]
      operationId: matchPoster
      summary: A Fix Match candidate's poster, from the server
      description: >-
        Capability `match-posters`. Takes a candidate's `poster_path` only, never an address: the
        server fetches it from TMDB once, keeps it in its cache and answers the image. Apps show
        their placeholder when this fails.
      parameters:
        - name: path
          in: query
          required: true
          description: A TMDB file path, `/name.jpg` (also `.jpeg`, `.png`, `.webp`).
          schema:
            type: string
            pattern: '^/[A-Za-z0-9_-]{1,64}\.(jpg|jpeg|png|webp)$'
        - name: size
          in: query
          schema:
            type: string
            enum: [w185, w342]
            default: w342
      responses:
        '200':
          description: The image.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
            image/webp:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '409':
          description: The server has no TMDB key.
          content:
            text/plain:
              schema:
                type: string
        '502':
          description: TMDB didn't give the image.
          content:
            text/plain:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Unavailable'
