        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/items/{id}/identify:
    post:
      tags: [admin]
      operationId: identifyItem
      summary: Fix Match, Back to Automatic, Split Off
      description: |
        `{tmdb_id}` (a movie's, or a show's), for an episode also `season`/`episode` (TMDB's
        numbering); `{local: true}`: named from the files, never looked up again; `type`: make it a
        movie or an episode; `part`: the episode's next part (`true`) or that part, instead of
        another version of it; `file_id`: that one of the title's files only.
        `{automatic: true, file_id?}`: the choices made here are forgotten and the server
        identifies the files on its own again. `{split: true, file_id}`: that file becomes a title
        of its own. Waits up to 40 s for the pass that applies it (`pending: true` when it still
        runs); answers the title's id after it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                tmdb_id:
                  type: integer
                season:
                  type: integer
                episode:
                  type: integer
                local:
                  type: boolean
                type:
                  type: string
                  enum: [movie, episode]
                part:
                  type: [boolean, integer]
                file_id:
                  type: string
                automatic:
                  type: boolean
                split:
                  type: boolean
      responses:
        '200':
          description: Applied.
          content:
            application/json:
              schema:
                type: object
                required: [files, item, file_item, pending, pass]
                properties:
                  files:
                    type: integer
                    description: Files changed.
                  item:
                    type: [string, 'null']
                    description: The title's id now.
                  file_item:
                    type: [string, 'null']
                    description: With `file_id`, the title that file is on now.
                  pending:
                    type: boolean
                  pass:
                    description: The pass that applied it (diagnostic), `null` while pending.
                    type: [object, 'null']
                    additionalProperties: true
              examples:
                matched:
                  $ref: examples/admin-identify.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/items/{id}/match:
    get:
      tags: [admin]
      operationId: matchInfo
      summary: A title as Fix Match shows it
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
        - name: compute
          in: query
          description: '`1`: a movie or show with no stored candidates gets some found now (TMDB searched).'
