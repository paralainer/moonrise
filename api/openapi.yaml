                days:
                  type: integer
                  description: Valid for (default 7).
      responses:
        '201':
          description: The invitation.
          content:
            application/json:
              schema:
                type: object
                required: [id, code, admin, expires_at]
                properties:
                  id:
                    type: string
                  code:
                    type: string
                    description: '`XXXX-XXXX`.'
                  admin:
                    type: boolean
                  expires_at:
                    type: string
                    format: date-time
              examples:
                created:
                  $ref: examples/admin-invite.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/invites/{id}:
    delete:
      tags: [admin]
      operationId: deleteInvitation
      summary: Withdraw an invitation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Withdrawn.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Deleted'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/admin/system:
    get:
      tags: [admin]
      operationId: systemInfo
      summary: The server itself (version, uptime, disk use, transcoding hardware)
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SystemInfo'
              examples:
                cpu:
                  $ref: examples/admin-system.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
  /v1/admin/activity:
    get:
      tags: [admin]
      operationId: activity
      summary: What the server is doing (playback, jobs, the scan, recent warnings)
      responses:
        '200':
          description: The activity.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
              examples:
                playing:
                  $ref: examples/admin-activity.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
  /v1/admin/logs:
    get:
      tags: [admin]
      operationId: serverLog
      summary: "The log's last lines (secrets redacted)"
      parameters:
        - name: lines
          in: query
          schema:
            type: integer
            minimum: 1
            default: 200
        - name: level
          in: query
          description: Only warnings and errors, or errors.
          schema:
            type: string
            enum: [warn, error]
      responses:
        '200':
          description: The lines, oldest first.
          content:
            application/json:
              schema:
                type: object
                required: [lines, total]
                properties:
                  lines:
                    type: array
                    items:
                      type: string
                  total:
                    type: integer
              examples:
                lines:
                  $ref: examples/admin-logs.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
  /v1/admin/restart:
    post:
      tags: [admin]
      operationId: restartServer
      summary: Restart the server
      description: |
        Only when something starts it again (`MOONRISE_RESTART=exit`, `can_restart` in
        `/v1/admin/system`); the server answers, then exits a moment later.
      responses:
        '200':
          description: Restarting.
          content:
            application/json:
              schema:
                type: object
                required: [restarting]
                properties:
                  restarting:
                    type: boolean
                    const: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '409':
          description: Nothing would start the server again.
          content:
            text/plain:
              schema:
                type: string
  /v1/admin/services:
    get:
      tags: [admin]
      operationId: services
      summary: The optional services (TMDB, OpenSubtitles, AI matching, ratings, remote access)
      responses:
        '200':
          description: The services.
          content:
            application/json:
              schema:
                type: object
                required: [services]
                properties:
                  services:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
              examples:
                new:
                  $ref: examples/admin-services.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
  /v1/admin/services/opensubtitles/check:
    post:
      tags: [admin]
      operationId: checkOpenSubtitlesAccount
      summary: Sign in to OpenSubtitles with an account (nothing saved)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [ok, allowed_downloads, vip]
                properties:
                  ok:
                    type: boolean
                    const: true
                  allowed_downloads:
                    type: [integer, 'null']
                  vip:
                    type: [boolean, 'null']
              examples:
                works:
                  $ref: examples/admin-opensubtitles-check.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '409':
          description: The server has no OpenSubtitles key.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: Not signed in (the text says why, to show as it is).
          content:
            text/plain:
              schema:
                type: string

  /v1/admin/llm:
    get:
      tags: [admin]
      operationId: llmOverview
      summary: "AI matching's provider: the presets, the settings, Sign in with ChatGPT"
      responses:
        '200':
          description: The provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LlmOverview'
              examples:
                new:
                  $ref: examples/admin-llm.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
  /v1/admin/llm/models:
    post:
      tags: [admin]
      operationId: llmModels
      summary: The models an endpoint offers
      description: What isn't given comes from the settings, or what is kept for that provider.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmRequest'
      responses:
        '200':
          description: The models.
          content:
            application/json:
              schema:
                type: object
                required: [models]
                properties:
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/LlmModel'
              examples:
                two:
                  $ref: examples/admin-llm-models.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '502':
          description: The endpoint failed (the text says how).
          content:
            text/plain:
              schema:
                type: string
  /v1/admin/llm/test:
    post:
      tags: [admin]
      operationId: llmTest
      summary: One real identification with these settings (nothing saved)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LlmRequest'
      responses:
        '200':
          description: 'How it went (`ok: false` with `problem` and `error` when it failed).'
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok:
                    type: boolean
                  correct:
                    type: boolean
                    description: The sample's right answer was picked.
                  verdict:
                    type: [object, 'null']
                    description: "The model's answer (`kind`, `tmdb_id`, `confidence`, `reason`…)."
                    additionalProperties: true
                  output:
                    type: string
                  ms:
                    type: integer
                  input_tokens:
                    type: [integer, 'null']
                  output_tokens:
                    type: [integer, 'null']
                  error:
                    type: string
                  problem:
                    type: string
                    enum: [unreachable, auth, not_found, format, limit, other]
              examples:
                unreachable:
                  $ref: examples/admin-llm-test.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
  /v1/admin/llm/chatgpt/start:
    post:
      tags: [admin]
      operationId: chatgptStart
      summary: 'Sign in with ChatGPT, step 1: the page to open'
      description: |
        OpenAI sends the browser back to `redirect_uri` (the app's loopback listener).
        `account`: sign in again with that registration (default: the one in use);
        `new_account`: a new registration; `retry`: the `state` of an attempt `finish` answered 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [redirect_uri]
              properties:
                redirect_uri:
                  type: string
                new_account:
                  type: boolean
                account:
                  type: string
                retry:
                  type: string
                app_flow:
                  type: integer
                  description: "The app's sign-in flow, for the server's log."
      responses:
        '200':
          description: The page.
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url:
                    type: string
              examples:
                page:
                  $ref: examples/admin-chatgpt-start.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '502':
          $ref: '#/components/responses/BadGateway'
  /v1/admin/llm/chatgpt/finish:
    post:
      tags: [admin]
      operationId: chatgptFinish
      summary: 'Sign in with ChatGPT, step 3: what came back to the app'
      description: |
        `{state, code, client_id?, callback_params?, app_flow?}`: the server exchanges the code;
        that registration is in use from then on. `{state, error, error_description?}`: OpenAI
        sent an error back instead (logged; the attempt ends; 422 with the message to show).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [state]
              properties:
                state:
                  type: string
                code:
                  type: string
                client_id:
                  type: string
                callback_params:
                  type: array
                  description: "The names (not values) of the callback's parameters, for the log."
                  items:
                    type: string
                app_flow:
                  type: integer
                error:
                  type: string
                error_description:
                  type: string
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                type: object
                required: [email, models]
                properties:
                  email:
                    type: string
                  models:
                    type: array
                    items:
                      $ref: '#/components/schemas/LlmModel'
              examples:
                signedIn:
                  $ref: examples/admin-chatgpt-finish.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '409':
          description: OpenAI refused the code; start again once with `retry` = this `state`.
          content:
            text/plain:
              schema:
                type: string
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/admin/llm/chatgpt/sign-out:
    post:
      tags: [admin]
      operationId: chatgptSignOut
      summary: Sign out of ChatGPT
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                account:
                  type: string
                  description: 'Default: the registration in use.'
      responses:
        '200':
          description: Signed out.
          content:
            application/json:
              schema:
                type: object
                required: [signed_in, revoked]
                properties:
                  signed_in:
                    type: boolean
                    const: false
                  revoked:
                    type: boolean
                    description: OpenAI confirmed the sign-in ended.
                  message:
                    type: string
                    description: What to do when it didn't.
              examples:
                revoked:
                  $ref: examples/admin-chatgpt-sign-out.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/admin/llm/chatgpt/forget:
    post:
      tags: [admin]
      operationId: chatgptForget
      summary: "Remove a ChatGPT registration that isn't signed in"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [account]
              properties:
                account:
                  type: string
      responses:
        '200':
          description: "Removed; `chatgpt` as `/v1/admin/llm` answers it."
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatGptState'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '422':
          $ref: '#/components/responses/Unprocessable'

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      description: |
        A Moonrise account token (`moonrise_…`), from signing in. Send it only in this header,
        never in a URL. Only these tokens have watch state.
    adminToken:
      type: apiKey
      in: header
      name: X-Moonrise-Admin
      description: The local admin token of the server's command line (`/data/secrets/admin.token`); not for apps.
    sessionId:
      type: apiKey
      in: query
      name: sid
      description: The id of a playback session playing the title (`session` in the playback answer), for the URLs a player fetches without headers.

  parameters:
    ItemId:
      name: id
      in: path
      required: true
      description: An item id, or `<item id>~<file id>` for one of its versions.
      schema:
        type: string
        examples: ['01exampleid000000000000002']
    ShowId:
      name: id
      in: path
      required: true
      description: A series' id.
      schema:
        type: string
    LibraryId:
      name: id
      in: path
      required: true
      schema:
        type: string
    SessionId:
      name: sid
      in: path
      required: true
      description: The playback session (`session` in the playback answer). Unknown or expired sessions answer `410`.
      schema:
        type: string
    VariantId:
      name: variant
      in: path
      required: true
      description: A variant's `id` (`copy` for the original).
      schema:
        type: string
    TrackIndex:
      name: index
      in: path
      required: true
      description: A track index (the library's, as in the playback answer).
      schema:
        type: integer
    SegmentFile:
      name: file
      in: path
      required: true
      description: '`init.mp4` or `<n>.m4s`.'
      schema:
        type: string
        examples: ['init.mp4', '0.m4s']
    JobId:
      name: job
      in: path
      required: true
      schema:
        type: string
    Version:
      name: version
      in: query
      description: A file id of the title (one of its versions). Without it, the user's chosen version, else the best file.
      schema:
        type: string
    OfflineVersion:
      name: v
      in: query
      description: The set's `version`; `409` when the file has changed since.
      schema:
        type: string
    Offset:
      name: offset
      in: query
      schema:
        type: integer
        minimum: 0
        default: 0
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 500
        default: 100
    RecentDays:
      name: recent_days
      in: query
      description: What `recently_added` counts.
      schema:
        type: integer
        minimum: 1
        maximum: 3650
        default: 30
    StreamStart:
      name: start
      in: query
      description: Seconds; where the playlist starts (`EXT-X-START`).
      schema:
        type: number
    StreamHdr:
      name: hdr
      in: query
      description: '`0`: the display can''t show HDR, so HDR titles are tone-mapped to SDR (capability `hdr-tonemap`).'
      schema:
        type: string
        enum: ['0', '1']
        default: '1'
    StreamQuality:
      name: quality
      in: query
      description: |
        The most bits/s to play at: the best variant of the ladder within it (capability
        `quality-ladder`). Left out: no limit, the original when it can be copied. A value that
        isn't a positive whole number (`original`, as some clients send) is ignored, as if left out.
      schema:
        type: integer
        minimum: 1
        examples: [4000000]
    StreamAbr:
      name: abr
      in: query
      description: '`1`: the master lists the lower variants too, for adaptive switching.'
      schema:
        type: string
        enum: ['0', '1']
    StreamDv:
      name: dv
      in: query
      description: '`1`: the player shows Dolby Vision; a Dolby Vision copy is signalled as such (capability `dolby-vision`).'
      schema:
        type: string
        enum: ['0', '1']
    StreamLossless:
      name: lossless
      in: query
      description: '`1`: the player decodes FLAC in fMP4 and its output takes more than 2 channels; lossless multichannel tracks come as FLAC with every channel (capability `lossless-audio`).'
      schema:
        type: string
        enum: ['0', '1']
    StreamTrick:
      name: trick
      in: query
      description: '`1`: the master lists the thumbnails as an I-frame stream, once they are made (capability `trickplay`).'
      schema:
        type: string
        enum: ['0', '1']
    FilterLibrary:
      name: library
      in: query
      description: A library's id.
      schema:
        type: string
    FilterGenre:
      name: genre
      in: query
      description: Comma-separated; any of them (with `genre_match=all`, all of them).
      schema:
        type: string
    FilterGenreMatch:
      name: genre_match
      in: query
      schema:
        type: string
        enum: [any, all]
    FilterRating:
      name: rating
      in: query
      description: Comma-separated certifications (spaces and case ignored); `none` for none.
      schema:
        type: string
    FilterStudio:
      name: studio
      in: query
      description: A studio (a network, for shows).
      schema:
        type: string
    FilterCollection:
      name: collection
      in: query
      description: A collection's id.
      schema:
        type: string
    FilterYearFrom:
      name: year_from
      in: query
      schema:
        type: integer
    FilterYearTo:
      name: year_to
      in: query
      schema:
        type: integer
    FilterResolution:
      name: resolution
      in: query
      description: Comma-separated, of `4k`, `1080`, `720`, `sd`.
      schema:
        type: string
    FilterHdr:
      name: hdr
      in: query
      description: '`1`: HDR only (a show: one of its episodes is).'
      schema:
        type: string
        enum: ['1']
    FilterUnplayed:
      name: unplayed
      in: query
      description: '`1`: not watched (shows: an episode isn''t). A Moonrise token''s watch state.'
      schema:
        type: string
        enum: ['1']
    FilterPlayed:
      name: played
      in: query
      description: '`1`: all watched.'
      schema:
        type: string
        enum: ['1']
    FilterInProgress:
      name: in_progress
      in: query
      description: '`1`: started and not finished.'
      schema:
        type: string
        enum: ['1']
    FilterAddedDays:
      name: added_days
      in: query
      description: Added in the last N days (a show, one of its episodes).
      schema:
        type: integer
        minimum: 1
    FilterOnly:
      name: only
      in: query
      description: Comma-separated item ids to stay within (the app's downloads).
      schema:
        type: string

    AccountId:
      name: id
      in: path
      required: true
      description: An account's id.
      schema:
        type: string

  responses:
    BadRequest:
      description: The request is malformed; the text says how.
      content:
        text/plain:
          schema:
            type: string
    Unauthorized:
      description: No token, or a wrong, revoked or expired one.
      content:
        text/plain:
          schema:
            type: string
    Forbidden:
      description: Not allowed for this caller (an admin token where an account is needed, …).
      content:
        text/plain:
          schema:
            type: string
    NotFound:
      description: No such item, track, file or code.
      content:
        text/plain:
          schema:
            type: string
    Conflict:
      description: The state doesn't allow it (taken, not ready).
      content:
        text/plain:
          schema:
            type: string
    FileChanged:
      description: The file changed since the set was described; describe it again.
      content:
        text/plain:
          schema:
            type: string
    SessionGone:
      description: No such playback session (closed, expired, or from before a restart). Ask `/playback` again at the current position.
      content:
        text/plain:
          schema:
            type: string
    Unprocessable:
      description: It can't be done for this title (the text says why).
      content:
        text/plain:
          schema:
            type: string
    TooManyRequests:
      description: Too many attempts, or a quota used up; try again later.
      content:
        text/plain:
          schema:
            type: string
    BadGateway:
      description: A service the server relies on (OpenSubtitles, TMDB) failed.
      content:
        text/plain:
          schema:
            type: string
    Unavailable:
      description: Switched off on this server (the library, accounts, downloads, a service), or busy.
      content:
        text/plain:
          schema:
            type: string
    Playlist:
      description: An HLS playlist.
      content:
        application/vnd.apple.mpegurl:
          schema:
            type: string
    Mp4:
      description: An fMP4 init section or segment.
      content:
        video/mp4:
          schema:
            type: string
            format: binary
    WebVtt:
      description: WebVTT.
      content:
        text/vtt:
          schema:
            type: string
    File:
      description: The file (or the range asked for).
      headers:
        ETag:
          schema:
            type: string
        Accept-Ranges:
          schema:
            type: string
        Content-Disposition:
          schema:
            type: string
      content:
        application/octet-stream:
          schema:
            type: string
            format: binary
    Played:
      description: How many titles changed, and the item's watch state now.
      content:
        application/json:
          schema:
            type: object
            required: [changed, user]
            properties:
              changed:
                type: integer
              user:
                oneOf:
                  - $ref: '#/components/schemas/UserState'
                  - type: 'null'
          examples:
            unplayed:
              $ref: examples/played.json
    VersionChoice:
      description: 'The version chosen now (`null`: none).'
      content:
        application/json:
          schema:
            type: object
            required: [version]
            properties:
              version:
                type: [string, 'null']
          examples:
            chosen:
              $ref: examples/version.json
    DownloadJob:
      description: The job.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/DownloadJob'
          examples:
            queued:
              $ref: examples/download-job.json

    AdminsOnly:
      description: Signed in, but not as an admin.
      content:
        text/plain:
          schema:
            type: string
    SmbNotFound:
      description: No such share or folder.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SmbFailure'
    SmbRefused:
      description: 'The share wants a login (`auth_required`), the password is wrong, or access is denied.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SmbFailure'
    SmbUnreachable:
      description: "The file server can't be reached, or failed otherwise."
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/SmbFailure'
          examples:
            unreachable:
              $ref: examples/admin-smb-failure.json

  schemas:
    Info:
      type: object
      required: [server_id, name, version, capabilities]
      properties:
        server_id:
          type: string
          description: Stable for the server's database.
        name:
          type: string
        version:
          type: string
          description: The server's version (semver).
        capabilities:
          type: array
          description: What this server can do. Unknown names are to be ignored.
          items:
            type: string
            examples: [hls-copy, trickplay, lossless-audio, subtitle-search, subtitle-windows, device-code, versions]
        setup:
          type: string
          enum: [unclaimed, claimed]
          description: '`unclaimed`: no accounts yet; it is set up with the code in its log.'
    Jobs:
      type: object
      properties:
        transcode_jobs:
          type: integer
        running:
          type: integer
        runs:
          type: array
          items:
            type: object
        subtitles:
          type: object

    User:
      type: object
      required: [id, name, is_admin]
      properties:
        id:
          type: string
        name:
          type: string
        is_admin:
          type: boolean
    SignIn:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
          description: 'Send as `Authorization: Bearer <token>`.'
        user:
          $ref: '#/components/schemas/User'
    Me:
      allOf:
        - $ref: '#/components/schemas/User'
        - type: object
          required: [device]
          properties:
            device:
              type: [object, 'null']
              properties:
                device_id:
                  type: [string, 'null']
                device_name:
                  type: [string, 'null']
                created_at:
                  type: [string, 'null']
                  format: date-time
                last_used:
                  type: [string, 'null']
                  format: date-time
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          maxLength: 64
        password:
          type: string
          maxLength: 1024
        device_id:
          type: string
          description: Stable per installation; signing in again from it replaces its token.
        device_name:
          type: string
    DeviceRequest:
      type: object
      properties:
        device_id:
          type: string
        device_name:
          type: string
    DeviceCode:
      type: object
      required: [device_code, user_code, verify_url, verify_url_complete, interval, expires_in]
      properties:
        device_code:
          type: string
          description: Secret; only for polling.
        user_code:
          type: string
          description: What the user types (`XXXX-XXXX`).
        verify_url:
          type: string
        verify_url_complete:
          type: string
        interval:
          type: integer
          description: Seconds between polls.
        expires_in:
          type: integer
          description: Seconds.
    DevicePoll:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, slow_down, expired, approved]
        interval:
          type: integer
        token:
          type: string
        user:
          $ref: '#/components/schemas/User'
    InviteRequest:
      type: object
      required: [code, username, password]
      properties:
        code:
          type: string
          examples: [ABCD-2345]
        username:
          type: string
        password:
          type: string
        device_id:
          type: string
        device_name:
          type: string

    Library:
      type: object
      required: [id, name, kind, collection_type, item_count, movies, shows, backdrop]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          enum: [movies, shows, mixed]
          description: What the library was made as (older apps); it decides nothing.
        collection_type:
          type: string
          enum: [movies, tvshows, mixed]
        item_count:
          type: integer
        movies:
          type: integer
        shows:
          type: integer
        backdrop:
          type: [string, 'null']
          description: An image id (the newest title's backdrop).
    LibraryList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Library'
        total:
          type: integer

    ImageSet:
      type: object
      required: [poster, backdrop, logo, thumb]
      description: Image ids for `GET /v1/images/{id}`.
      properties:
        poster:
          type: [string, 'null']
        backdrop:
          type: array
          items:
            type: string
        logo:
          type: [string, 'null']
        thumb:
          type: [string, 'null']
          description: 16:9; an episode's still, else the first backdrop.
        season_poster:
          type: string
          description: In an episode's `parent_images`, its season's poster.
    UserState:
      type: object
      description: |
        A Moonrise account's watch state of the item. Movies and episodes: `position`, `played`,
        `play_count`, `last_played_at`, `played_percentage`; one item's answer also `version`.
        Series and seasons: `played` (every episode), `unplayed_item_count`, `last_played_at`.
      required: [played, position, last_played_at]
      properties:
        position:
          type: number
          description: The resume point, seconds (0 for none).
        played:
          type: boolean
        play_count:
          type: integer
        last_played_at:
          type: [string, 'null']
          format: date-time
        played_percentage:
          type: [number, 'null']
        unplayed_item_count:
          type: integer
        version:
          type: [string, 'null']
          description: The file id of the version this user chose.
    Identify:
      type: object
      required: [state, source, confidence, note]
      properties:
        state:
          type: string
          description: '`matched`, `manual`, `local`, `review`, …'
        source:
          type: [string, 'null']
        confidence:
          type: [number, 'null']
        note:
          type: [string, 'null']
    MediaSummary:
      type: object
      description: The best file's tracks, for badges.
      required: [video, audio, subtitles]
      properties:
        video:
          type: [object, 'null']
          required: [codec, width, height, range, title]
          properties:
            codec:
              type: string
            width:
              type: [integer, 'null']
            height:
              type: [integer, 'null']
            range:
              type: [string, 'null']
            title:
              type: string
        audio:
          type: array
          items:
            type: object
            required: [codec, channels, profile, language, title, default]
            properties:
              codec:
                type: string
              channels:
                type: [integer, 'null']
              profile:
                type: [string, 'null']
              language:
                type: [string, 'null']
              title:
                type: string
              default:
                type: boolean
        subtitles:
          type: array
          items:
            type: object
            required: [codec, language, text, forced]
            properties:
              codec:
                type: string
              language:
                type: [string, 'null']
              text:
                type: boolean
              forced:
                type: boolean
    Ratings:
      type: object
      description: Other scores, when there are any (beside TMDB's `community_rating`).
      properties:
        imdb:
          type: object
          required: [value]
          properties:
            value:
              type: number
            votes:
              type: integer
        rotten_tomatoes:
          type: object
          required: [value]
          properties:
            value:
              type: integer
        metacritic:
          type: object
          required: [value]
          properties:
            value:
              type: integer
    Item:
      type: object
      description: A movie, series, season or episode, as lists answer it.
      required:
        - id
        - kind
        - library_id
        - title
        - sort_title
        - original_title
        - year
        - premiere_date
        - end_date
        - status
        - overview
        - tagline
        - official_rating
        - community_rating
        - critic_rating
        - genres
        - studios
        - provider_ids
        - runtime
        - images
        - series_id
        - series_title
        - season_id
        - season_title
        - season_no
        - episode_no
        - episode_end
        - identify
        - added_at
        - updated_at
        - user
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [movie, series, season, episode]
        library_id:
          type: string
        title:
          type: string
        sort_title:
          type: [string, 'null']
        original_title:
          type: [string, 'null']
        year:
          type: [integer, 'null']
        premiere_date:
          type: [string, 'null']
          description: A date (`2008-04-10`).
        end_date:
          type: [string, 'null']
        status:
          type: [string, 'null']
        overview:
          type: [string, 'null']
        tagline:
          type: [string, 'null']
        official_rating:
          type: [string, 'null']
          description: The certification (`PG-13`, `MA 15+`).
        community_rating:
          type: [number, 'null']
        critic_rating:
          type: [number, 'null']
        genres:
          type: array
          items:
            type: string
        studios:
          type: array
          items:
            type: string
        provider_ids:
          type: object
          description: Ids at other databases (`Tmdb`, `Imdb`, `Tvdb`).
          additionalProperties:
            type: string
        runtime:
          type: [number, 'null']
          description: Seconds; the file's own length when it has one.
        tmdb_runtime:
          type: [number, 'null']
          description: TMDB's runtime, when `runtime` is the file's.
        images:
          $ref: '#/components/schemas/ImageSet'
        parent_images:
          $ref: '#/components/schemas/ImageSet'
        series_id:
          type: [string, 'null']
        series_title:
          type: [string, 'null']
        season_id:
          type: [string, 'null']
        season_title:
          type: [string, 'null']
        season_no:
          type: [integer, 'null']
        episode_no:
          type: [integer, 'null']
        episode_end:
          type: [integer, 'null']
          description: The last episode of a file with several.
        part:
          type: integer
          description: One part of an episode split over several files.
        parts:
          type: [integer, 'null']
        collection:
          type: object
          required: [id, name]
          properties:
            id:
              type: integer
            name:
              type: [string, 'null']
        identify:
          $ref: '#/components/schemas/Identify'
        added_at:
          type: string
          format: date-time
          description: When the title was added, or (a movie or episode) when a later file of it arrived, a new version or a replacement.
        updated_at:
          type: string
          format: date-time
        latest_added_at:
          type: string
          format: date-time
          description: A show in a latest row, when its newest episode came.
        user:
          oneOf:
            - $ref: '#/components/schemas/UserState'
            - type: 'null'
        child_count:
          type: integer
          description: Series, seasons; seasons, episodes.
        episode_count:
          type: integer
        media:
          $ref: '#/components/schemas/MediaSummary'
        versions:
          type: integer
          description: How many files (versions) the title has.
        ratings:
          $ref: '#/components/schemas/Ratings'
        continue:
          type: object
          description: In `continue`, why the item is there.
          required: [reason, at, from]
          properties:
            reason:
              type: string
              enum: [resume, next_episode, collection_next]
            at:
              type: string
              format: date-time
            from:
              type: [string, 'null']
              description: The item watched that led here.
    ItemDetail:
      allOf:
        - $ref: '#/components/schemas/Item'
        - type: object
          required: [people, files, chapters]
          properties:
            people:
              type: array
              items:
                type: object
                required: [id, name, kind, role, image]
                properties:
                  id:
                    type: string
                  name:
                    type: string
                  kind:
                    type: string
                    description: Actor, Director, Writer, …
                  role:
                    type: [string, 'null']
                  image:
                    type: [string, 'null']
            files:
              type: array
              items:
                $ref: '#/components/schemas/File'
            chapters:
              type: array
              items:
                type: object
                required: [start, name]
                properties:
                  start:
                    type: [number, 'null']
                  name:
                    type: [string, 'null']
            requested_id:
              type: string
              description: The id asked for, when it was merged into this one.
    File:
      type: object
      required: [id, name, container, size, duration, bitrate, version_label, missing, tracks, manual, broken, broken_reason]
      properties:
        id:
          type: string
        name:
          type: string
        container:
          type: [string, 'null']
        size:
          type: integer
        duration:
          type: [number, 'null']
        bitrate:
          type: [integer, 'null']
        version_label:
          type: [string, 'null']
        missing:
          type: boolean
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Stream'
        manual:
          type: boolean
          description: Placed by Fix Match.
        broken:
          type: boolean
          description: Damaged or unreadable; playback picks a healthy version where there is one.
        broken_reason:
          type: [string, 'null']
        version:
          $ref: '#/components/schemas/FileVersion'
        position:
          type: number
          description: Where this user stopped in this version (signed in).
    FileVersion:
      type: object
      required: [label, details, edition, resolution, hdr, codec, audio_languages, dub, source]
      properties:
        label:
          type: string
          description: Tells the version from the title's others.
        details:
          type: string
        edition:
          type: [string, 'null']
        resolution:
          type: [string, 'null']
        hdr:
          type: [string, 'null']
        codec:
          type: [string, 'null']
        audio_languages:
          type: array
          items:
            type: string
        dub:
          type: [string, 'null']
        source:
          type: [string, 'null']
    Stream:
      type: object
      description: A track of a file (the library's index).
      required: [index, kind, codec, language, title, display_title, is_default, is_forced, is_hearing_impaired, is_external, is_text]
      properties:
        index:
          type: integer
        kind:
          type: string
          enum: [Video, Audio, Subtitle, EmbeddedImage, Data]
        codec:
          type: string
        language:
          type: [string, 'null']
        title:
          type: [string, 'null']
        display_title:
          type: string
        is_default:
          type: boolean
        is_forced:
          type: boolean
        is_hearing_impaired:
          type: boolean
        is_external:
          type: boolean
        is_text:
          type: boolean
        path:
          type: string
        width:
          type: integer
        height:
          type: integer
        channels:
          type: integer
        channel_layout:
          type: string
        profile:
          type: string
        bitrate:
          type: integer
        video_range_type:
          type: string
          description: SDR, HDR10, HLG, DOVI, DOVIWithHDR10, …
    ItemList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        total:
          type: integer
        offset:
          type: integer
        index:
          type: array
          description: A title sort's alphabet index into the whole list.
          items:
            type: object
            required: [letter, offset]
            properties:
              letter:
                type: string
              offset:
                type: integer
        notes:
          type: array
          items:
            type: string
    SearchResults:
      type: object
      required: [titles, episodes]
      properties:
        titles:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        episodes:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    SearchStart:
      type: object
      required: [recent, suggestions]
      properties:
        recent:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        suggestions:
          type: array
          items:
            $ref: '#/components/schemas/Item'
    Home:
      type: object
      required: [continue, resume, next_up, latest_types, latest]
      properties:
        continue:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        resume:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        next_up:
          type: array
          items:
            $ref: '#/components/schemas/Item'
        latest_types:
          type: array
          items:
            type: object
            required: [type, title, items]
            properties:
              type:
                type: string
                enum: [movie, series]
              title:
                type: string
              items:
                type: array
                items:
                  $ref: '#/components/schemas/Item'
        latest:
          type: object
          description: Per library id, its newest titles (older apps).
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/Item'
        notes:
          type: array
          items:
            type: string
    FacetValue:
      type: object
      required: [name, count]
      properties:
        name:
          type: string
        count:
          type: integer
        backdrop:
          type: [string, 'null']
    Facets:
      type: object
      required: [total, genres, studios, years, decades, ratings, collections, resolutions, hdr, watched, recently_added, libraries, kind]
      properties:
        total:
          type: integer
        genres:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        studios:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        years:
          type: array
          items:
            type: object
            required: [year, count]
            properties:
              year:
                type: integer
              count:
                type: integer
        decades:
          type: array
          items:
            type: object
            required: [decade, count, backdrop]
            properties:
              decade:
                type: integer
              count:
                type: integer
              backdrop:
                type: [string, 'null']
        ratings:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        collections:
          type: array
          items:
            type: object
            required: [id, name, count, poster, backdrop]
            properties:
              id:
                type: integer
              name:
                type: string
              count:
                type: integer
              poster:
                type: [string, 'null']
              backdrop:
                type: [string, 'null']
        resolutions:
          type: array
          items:
            $ref: '#/components/schemas/FacetValue'
        hdr:
          type: integer
        watched:
          type: [object, 'null']
          description: A Moonrise token's watch state (null for other callers).
          required: [all, unplayed, in_progress, played]
          properties:
            all:
              type: integer
            unplayed:
              type: integer
            in_progress:
              type: integer
            played:
              type: integer
        recently_added:
          type: object
          required: [days, count]
          properties:
            days:
              type: integer
            count:
              type: integer
        libraries:
          type: array
          items:
            type: object
            required: [id, name, count]
            properties:
              id:
                type: string
              name:
                type: string
              count:
                type: integer
        kind:
          type: string
          enum: [movie, series]
        library:
          type: string
        notes:
          type: array
          items:
            type: string
    Segments:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            type: object
            required: [kind, start, end, source]
            properties:
              kind:
                type: string
                enum: [intro, recap, credits, preview]
              start:
                type: number
              end:
                type: number
              source:
                type: string
                description: '`theintrodb` and `introdb` only in a merged answer.'
                enum: [chapters, detected, theintrodb, introdb]
        total:
          type: integer
        pending:
          type: boolean
          description: The end credits are still being looked for in the file; ask again later.
        merged:
          type: boolean
          description: The answer is merged (`merged=1` asked, server 0.28+).
        community_pending:
          type: boolean
          description: >-
            In a merged answer, the title waits for its community lookup; ask again a few seconds
            later (and near the end). Meanwhile no end credits are offered (server 0.28.1+): the
            file's could start before a database start not known yet. Intro and recap are offered.
            False once the answer is in, known empty, or the databases can't be asked.

    Playback:
      type: object
      required: [item_id, media_source_id, version, source_kind, container, duration, supported, reasons, method, pending, video, audio, subtitles, master, variants, variant, notes, session]
      properties:
        item_id:
          type: string
        media_source_id:
          type: string
          description: The file's id.
        version:
          type: string
          description: Changes when the file does.
        source_kind:
          type: string
        container:
          type: string
        duration:
          type: number
        supported:
          type: boolean
        reasons:
          type: array
          description: Why it can't be served as asked.
          items:
            type: string
        method:
          type: string
          enum: [copy, convert, transcode]
          description: '`convert`: some audio converted; `transcode`: the video variant served is re-encoded.'
        pending:
          type: boolean
          description: The keyframe index is being made; ask again shortly.
        video:
          oneOf:
            - $ref: '#/components/schemas/VideoTrack'
            - type: 'null'
        audio:
          type: array
          items:
            $ref: '#/components/schemas/AudioTrack'
        subtitles:
          type: array
          items:
            $ref: '#/components/schemas/SubtitleTrack'
        master:
          type: [string, 'null']
          description: The master playlist (relative to the server), when supported.
        variants:
          type: array
          description: The title's ladder for these options, best first.
          items:
            $ref: '#/components/schemas/Variant'
        variant:
          type: [string, 'null']
          description: The one played (an id from `variants`).
        notes:
          type: array
          description: Served, but not quite as asked.
          items:
            type: string
        session:
          type: [string, 'null']
          description: The playback session; reports go to `/v1/sessions/{session}/…`.
        tracks:
          $ref: '#/components/schemas/RememberedTracks'
    RememberedTracks:
      type: object
      description: |
        The audio and subtitle tracks this user picked last (server 0.29.0+, capability
        `track-memory`): in this file (`same_file`), else in another version of the title, else in
        another episode of the show. Absent when there are none, or for the admin token. With
        `same_file`, find a track by `index` first (when its language agrees), else by its
        description; otherwise by description only (language, title, forced, SDH), and play the
        defaults when nothing matches. The subtitle Delay is the track's own timing `nudge`.
      required: [same_file, audio, subtitle, subtitle_off]
      properties:
        same_file:
          type: boolean
        audio:
          oneOf:
            - $ref: '#/components/schemas/TrackPick'
            - type: 'null'
        subtitle:
          oneOf:
            - $ref: '#/components/schemas/TrackPick'
            - type: 'null'
        subtitle_off:
          type: boolean
          description: Subtitles were turned off.
    TrackPick:
      type: object
      description: A track as the app describes it; any field may be missing.
      properties:
        index:
          type: integer
          description: The server's track index (absent for a track only a device knows, a download's).
        language:
          type: string
        title:
          type: string
        forced:
          type: boolean
        sdh:
          type: boolean
    TracksChoice:
      type: object
      description: |
        The audio and subtitle tracks playing, kept per user and file (capability `track-memory`).
        A missing key keeps what is kept; `subtitle: null` means subtitles off.
      properties:
        audio:
          $ref: '#/components/schemas/TrackPick'
        subtitle:
          oneOf:
            - $ref: '#/components/schemas/TrackPick'
            - type: 'null'
    VideoTrack:
      type: object
      required: [index, stream, codec, codecs_attr, width, height, frame_rate, range, bitrate]
      properties:
        index:
          type: integer
        stream:
          type: integer
          description: The stream's index in the file.
        codec:
          type: string
        codecs_attr:
          type: [string, 'null']
          description: RFC 6381.
        width:
          type: integer
        height:
          type: integer
        frame_rate:
          type: [number, 'null']
        range:
          type: string
          enum: [SDR, PQ, HLG]
        bitrate:
          type: integer
    AudioTrack:
      type: object
      required: [index, stream, codec, codecs_attr, name, language, channels, default, converted, conversion]
      properties:
        index:
          type: integer
        stream:
          type: integer
        codec:
          type: string
          description: The source's codec.
        codecs_attr:
          type: string
          description: As served (RFC 6381).
        name:
          type: string
        language:
          type: [string, 'null']
        channels:
          type: integer
          description: As served.
        default:
          type: boolean
        converted:
          type: boolean
          description: Served converted, not copied.
        conversion:
          type: [object, 'null']
          required: [codec, channels, sample_rate, bitrate]
          properties:
            codec:
              type: string
              enum: [aac, eac3, flac]
            channels:
              type: integer
            sample_rate:
              type: integer
            bitrate:
              type: integer
    SubtitleTrack:
      type: object
      required: [index, stream, text, codec, name, language, forced, default, external, source, url]
      properties:
        index:
          type: integer
          description: Fetched and uploaded tracks are 10000 and up.
        stream:
          type: [integer, 'null']
        text:
          type: boolean
          description: |
            Text (a WebVTT rendition), or pictures (PGS, DVD, DVB): served as images in the
            subtitle windows (`cues`), which the app draws over the video.
        codec:
          type: string
        name:
          type: string
        language:
          type: [string, 'null']
        forced:
          type: boolean
        default:
          type: boolean
        external:
          type: boolean
        source:
          type: string
          enum: [embedded, sidecar, opensubtitles, upload]
        url:
          type: [string, 'null']
          description: Text tracks, the whole track as SRT (relative to the server).
        timing:
          $ref: '#/components/schemas/SubtitleTiming'
    Variant:
      type: object
      required: [id, label, bitrate, width, height, codec, range, transcode, tonemap]
      properties:
        id:
          type: string
          description: '`copy` for the copied original.'
        label:
          type: string
        bitrate:
          type: integer
        width:
          type: integer
        height:
          type: integer
        codec:
          type: string
        range:
          type: string
          enum: [SDR, PQ, HLG]
        transcode:
          type: boolean
        tonemap:
          type: boolean

    Report:
      type: object
      properties:
        position:
          type: number
          description: Seconds into the title.
        paused:
          type: boolean
        audio:
          type: integer
          description: The audio track's index (accepted, not used; see `tracks`).
        subtitle:
          type: integer
          description: The subtitle track's index (accepted, not used; see `tracks`).
        credits:
          type: number
          description: Where the end credits the app offers start (seconds), if it has any.
        tracks:
          $ref: '#/components/schemas/TracksChoice'
    ReportResult:
      type: object
      required: [recorded]
      properties:
        recorded:
          type: boolean
        item:
          type: string
        outcome:
          type: [string, 'null']
          enum: [resume, played, cleared, null]
        user:
          oneOf:
            - $ref: '#/components/schemas/UserState'
            - type: 'null'
        reason:
          type: string
          description: Why it wasn't recorded.
    LocalReport:
      type: object
      required: [viewing, item, event, at]
      properties:
        viewing:
          type: string
          description: The device's id for one playback (it counts as played once).
        item:
          type: string
        event:
          type: string
          enum: [start, progress, stop]
        position:
          type: number
        at:
          type: integer
          description: When it happened, Unix seconds.
        duration:
          type: number
        credits:
          type: number
        tracks:
          $ref: '#/components/schemas/TracksChoice'
        file:
          type: string
          description: The file (version) the download was made from; with `tracks`, the choice is kept for it.
    LocalReportResults:
      type: object
      required: [results]
      properties:
        results:
          type: array
          items:
            type: object
            required: [item, recorded]
            properties:
              item:
                type: string
              recorded:
                type: boolean
              outcome:
                type: [string, 'null']
                enum: [resume, played, cleared, null]
              reason:
                type: string
        reason:
          type: string

    SubtitleTiming:
      type: object
      required: [state, offset, scale, pieces, nudge, original]
      properties:
        state:
          type: string
          enum: [none, pending, synced, in_sync, unsure, failed]
        reference:
          type: string
          enum: [subtitles, audio]
        offset:
          type: number
          description: How far the match moved the cues (the median), seconds.
        scale:
          type: number
        pieces:
          type: integer
        nudge:
          type: number
          description: The viewer's correction, seconds (positive is later).
        original:
          type: boolean
          description: The viewer chose the original timing over the match.
    CueWindow:
      type: object
      required: [index, window, from, to, span, complete, source, cues]
      properties:
        index:
          type: integer
        window:
          type: integer
        from:
          type: number
        to:
          type: number
        span:
          type: number
        complete:
          type: boolean
          description: The whole track is ready; fetch the `.srt` instead of windows.
        source:
          type: string
          enum: [file, memory, index, scan, mp4, ffmpeg, ffprobe]
        canvas:
          type: object
          description: Picture tracks, the frame the images are placed on.
          required: [width, height]
          properties:
            width:
              type: integer
            height:
              type: integer
        cues:
          type: array
          items:
            type: object
            required: [start, end, text]
            properties:
              start:
                type: number
              end:
                type: number
              text:
                type: string
                description: Empty for a picture.
              image:
                type: object
                description: Picture tracks, the picture and its place on the canvas.
                required: [x, y, width, height, png]
                properties:
                  x:
                    type: integer
                  y:
                    type: integer
                  width:
                    type: integer
                  height:
                    type: integer
                  png:
                    type: string
                    contentEncoding: base64
    SubtitleSearch:
      type: object
      required: [results, remaining_downloads, quota]
      properties:
        results:
          type: array
          items:
            type: object
            required: [id, name, language, format, downloads, rating, hash_match, hearing_impaired, machine_translated, ai_translated, fps, uploader, upload_date, fetched]
            properties:
              id:
                type: string
                description: What `fetch` takes.
              name:
                type: string
                description: The release name.
              language:
                type: [string, 'null']
              format:
                type: string
              downloads:
                type: integer
              rating:
                type: number
              hash_match:
                type: boolean
              hearing_impaired:
                type: boolean
              machine_translated:
                type: boolean
              ai_translated:
                type: boolean
              fps:
                type: [number, 'null']
              uploader:
                type: [string, 'null']
              upload_date:
                type: [string, 'null']
              fetched:
                type: boolean
        remaining_downloads:
          type: [integer, 'null']
        quota:
          type: object
          required: [tier, allowed, remaining, reset_at, account_allowed]
          properties:
            tier:
              type: string
              enum: [anonymous, user, vip]
            allowed:
              type: [integer, 'null']
            remaining:
              type: [integer, 'null']
            reset_at:
              type: [string, 'null']
              format: date-time
            account_allowed:
              type: integer

    Trickplay:
      type: object
      required: [state]
      properties:
        state:
          type: string
          enum: [ready, pending, 'off']
        interval:
          type: number
          description: Seconds between pictures.
        width:
          type: integer
        height:
          type: integer
        columns:
          type: integer
        rows:
          type: integer
        count:
          type: integer
        sheets:
          type: array
          items:
            type: string
            description: A sheet's URL (relative to the server).

    DownloadJobParams:
      type: object
      properties:
        quality:
          type: [integer, 'null']
          description: Bits/s (null or absent, the original).
        audio:
          type: [array, 'null']
          description: Audio track indices, the first the default. Default one per language, the default track first, at most 4.
          items:
            type: integer
        hdr:
          type: [boolean, 'null']
          description: The device shows HDR (default true); false tone-maps to SDR.
        container:
          type: [string, 'null']
          enum: [mp4, null]
    DownloadJob:
      type: object
      required: [id, item_id, params, label, method, audio, state, progress, size, expected, error, created_at, finished_at, downloaded_at, expires_at, file]
      properties:
        id:
          type: string
        item_id:
          type: string
        params:
          $ref: '#/components/schemas/DownloadJobParams'
        label:
          type: string
        method:
          type: string
          enum: [remux, transcode]
        audio:
          type: array
          items:
            type: integer
        state:
          type: string
          enum: [queued, running, done, failed]
        progress:
          type: number
          minimum: 0
          maximum: 1
        size:
          type: integer
          description: Bytes written so far (the final size when done).
        expected:
          type: integer
        error:
          type: [string, 'null']
        created_at:
          type: integer
          description: Unix seconds.
        finished_at:
          type: [integer, 'null']
        downloaded_at:
          type: [integer, 'null']
        expires_at:
          type: [integer, 'null']
          description: When the file is deleted (Unix seconds).
        file:
          type: [string, 'null']
          description: Where to get it, when done.
    DownloadJobList:
      type: object
      required: [jobs, disk_used, disk_reserved, disk_max, enabled]
      properties:
        jobs:
          type: array
          items:
            $ref: '#/components/schemas/DownloadJob'
        disk_used:
          type: integer
        disk_reserved:
          type: integer
        disk_max:
          type: integer
        enabled:
          type: boolean
    OfflineSet:
      type: object
      required: [item_id, version, variant, duration, segments, audio, subtitles, master, playlist, subs_playlist, expected, base]
      properties:
        item_id:
          type: string
        version:
          type: string
          description: Send it as `v=` with every file.
        variant:
          $ref: '#/components/schemas/Variant'
        duration:
          type: number
        segments:
          type: integer
          description: Segments per track (video and every audio track have the same).
        audio:
          type: array
          items:
            type: object
            required: [index, name, language, channels, codecs, default, converted]
            properties:
              index:
                type: integer
              name:
                type: string
              language:
                type: [string, 'null']
              channels:
                type: integer
              codecs:
                type: string
              default:
                type: boolean
              converted:
                type: boolean
        subtitles:
          type: array
          items:
            type: object
            required: [index, name, language, forced]
            properties:
              index:
                type: integer
              name:
                type: string
              language:
                type: [string, 'null']
              forced:
                type: boolean
        master:
          type: string
          description: The master playlist, URIs relative to `base`.
        playlist:
          type: string
          description: Every track's media playlist (`init.mp4`, `n.m4s`).
        subs_playlist:
          type: string
          description: Every subtitle rendition's playlist (`cues.vtt`).
        expected:
          type: integer
          description: Estimated bytes of the whole set.
        base:
          type: string
          description: Where the files are (`/v1/items/{id}/offline/{variant}`).

    # The admin API (/v1/admin/…). Answers that are diagnostic, or that the server extends often,
    # are open (`additionalProperties: true`) beyond the fields described.
    SecretState:
      type: object
      description: A secret as answered (never its value).
      required: [set]
      properties:
        set:
          type: boolean
        last4:
          type: string
          description: "An API key's last 4 characters."
        builtin:
          type: boolean
          description: "Moonrise's built-in key."
    SettingsDocument:
      type: object
      required: [settings, fields, libraries, restart_required]
      properties:
        settings:
          type: object
          description: The values, nested by section; secrets as `SecretState`.
          additionalProperties: true
        fields:
          type: object
          description: Per dotted key, where its value comes from and when a change applies.
          additionalProperties:
            type: object
            required: [source, apply]
            properties:
              source:
                type: string
                enum: [env, file, store, builtin, default]
              env:
                type: string
                description: The environment variable that sets it.
              apply:
                type: string
                enum: [live, restart, env-only]
              restart_pending:
                type: boolean
                description: Stored, but the server still runs with the old value.
        libraries:
          $ref: '#/components/schemas/ManagedLibraryList'
        restart_required:
          type: array
          description: Keys changed that take effect after a restart.
          items:
            type: string
    LibraryRoot:
      type: object
      description: A library's folder, with its state at the last scan pass.
      required: [source, path, available]
      properties:
        source:
          type: string
          enum: [local, smb]
        path:
          type: string
          description: 'A folder of the server (`local`), or in the share (`smb`, `/`-separated).'
        available:
          type: boolean
        host:
          type: string
        share:
          type: string
        url:
          type: string
          description: '`smb://host/share/path`.'
        credential_id:
          type: [string, 'null']
        username:
          type: [string, 'null']
        state:
          type: string
          enum: [online, offline]
        error:
          type: string
          description: Why it is offline.
        since:
          type: integer
          description: Since when it is in this state (Unix seconds).
    ManagedLibrary:
      type: object
      required: [id, name, kind, roots]
      properties:
        id:
          type: string
        name:
          type: string
        kind:
          type: string
          description: What it was made as (`movies`, `shows`, `mixed`); libraries have no type now.
        roots:
          type: array
          items:
            $ref: '#/components/schemas/LibraryRoot'
    ManagedLibraryChanged:
      allOf:
        - $ref: '#/components/schemas/ManagedLibrary'
        - type: object
          required: [scan]
          properties:
            scan:
              type: string
              description: '`started`, or why not.'
    ManagedLibraryList:
      type: object
      required: [items, managed_by]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/ManagedLibrary'
        total:
          type: integer
        managed_by:
          type: string
          enum: [store, env]
          description: '`env`: set by `MOONRISE_LIBRARIES`, not editable here.'
    LibraryRootRequest:
      description: |
        A folder: a path, `{source: local, path}`, or `{source: smb, host, share, path}` with
        `credential_id` or `username`/`password`/`domain` (stored as a login, reused when
        identical; neither: as a guest), or `{url: "smb://host/share/path", …}`.
      oneOf:
        - type: string
        - type: object
          properties:
            source:
              type: string
              enum: [local, smb]
            path:
              type: string
            host:
              type: string
            share:
              type: string
            url:
              type: string
            credential_id:
              type: string
            username:
              type: string
            password:
              type: string
            domain:
              type: string
    LibraryRequest:
      type: object
      required: [name, roots]
      properties:
        name:
          type: string
        kind:
          type: string
          enum: [movies, shows, mixed]
          description: Optional; libraries have no type.
        roots:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/LibraryRootRequest'
    Folder:
      type: object
      required: [name, path]
      properties:
        name:
          type: string
        path:
          type: string
    FolderListing:
      type: object
      required: [path, parent, dirs, video_files, truncated]
      properties:
        path:
          type: [string, 'null']
          description: '`null`: the list of folders browsing may start at.'
        parent:
          type: [string, 'null']
        dirs:
          type: array
          items:
            $ref: '#/components/schemas/Folder'
        video_files:
          type: integer
          description: Video files directly in the folder.
        truncated:
          type: boolean
    SmbLogin:
      type: object
      description: 'A saved login (`credential_id`), or a user name and password (neither: as a guest).'
      properties:
        credential_id:
          type: string
        username:
          type: string
        password:
          type: string
        domain:
          type: string
    SmbTarget:
      type: object
      description: 'A folder in a share: `host`, `share` and `path`, or `url`.'
      properties:
        host:
          type: string
        share:
          type: string
        path:
          type: string
        url:
          type: string
          description: '`smb://host/share/path`.'
    SmbFailure:
      type: object
      required: [error, problem, detail]
      properties:
        error:
          type: string
          description: To show.
        problem:
          type: string
          enum: [unreachable, auth_required, wrong_password, access_denied, not_found, other]
        detail:
          type: string
    SmbCredential:
      type: object
      required: [id, host, username, domain, password, used_by]
      properties:
        id:
          type: string
        host:
          type: [string, 'null']
        username:
          type: string
        domain:
          type: string
        password:
          $ref: '#/components/schemas/SecretState'
        used_by:
          type: array
          description: The libraries using it.
          items:
            type: string
    SmbCredentialList:
      type: object
      required: [items, total]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SmbCredential'
        total:
          type: integer
    SmbCredentialRequest:
      type: object
      properties:
        host:
          type: string
        username:
          type: string
        password:
          type: string
        domain:
          type: string
    ScanProgress:
      type: object
      required: [phase, full, started_at, walked, identify, passes, last_pass, libraries, roots]
      properties:
        phase:
          type: string
          enum: [idle, queued, scanning, identifying, metadata, finishing]
        full:
          type: boolean
        started_at:
          type: [integer, 'null']
          description: Unix seconds.
        walked:
          type: integer
          description: Files seen by the walk.
        identify:
          type: object
          required: [done, total]
          properties:
            done:
              type: integer
            total:
              type: integer
        passes:
          type: integer
        last_pass:
          type: [object, 'null']
          additionalProperties: true
          properties:
            at:
              type: integer
              description: Unix seconds.
            ms:
              type: integer
            error:
              type: [string, 'null']
            aborted:
              type: [string, 'null']
            files_seen:
              type: integer
            offline:
              type: array
              items:
                type: string
        libraries:
          type: array
          items:
            type: object
            required: [id, name, kind, files, identified, movies, series, episodes, review, review_episodes, settling]
            properties:
              id:
                type: string
              name:
                type: string
              kind:
                type: string
              files:
                type: integer
              identified:
                type: integer
              movies:
                type: integer
              series:
                type: integer
              episodes:
                type: integer
              review:
                type: integer
                description: Movies and shows waiting in Fix Match.
              review_episodes:
                type: integer
                description: "Episodes waiting in Fix Match, of shows that aren't."
              settling:
                type: integer
                description: Files still being written (looked at again shortly).
        roots:
          type: object
          description: Per folder (its path or URL), whether it was reachable.
          additionalProperties:
            type: object
            required: [online, since, checked_at]
            properties:
              online:
                type: boolean
              error:
                type: string
              since:
                type: integer
              checked_at:
                type: integer
    InLibrary:
      type: object
      description: What the library has of it already (matching it adds a version or a part).
      properties:
        item:
          type: string
        titles:
          type: integer
        files:
          type: integer
    MatchCandidate:
      type: object
      required: [tmdb_id, title]
      properties:
        tmdb_id:
          type: integer
        title:
          type: [string, 'null']
        original_title:
          type: [string, 'null']
        year:
          type: [integer, 'null']
        overview:
          type: [string, 'null']
        poster:
          type: [string, 'null']
          description: A TMDB image URL. Left out with `server_posters=1`.
        poster_path:
          type: string
          description: >-
            With `server_posters=1`, when the candidate has a poster: the `path` for
            `/v1/admin/match/poster`.
        score:
          type: number
          description: How well it matched the file (stored candidates).
        in_library:
          $ref: '#/components/schemas/InLibrary'
    ReviewItem:
      type: object
      required: [id, kind, title, key, state, source, confidence, note, files, candidates, year, library, series_id, series_title, series_tmdb_id, season, episode, episode_end]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [movie, series, season, episode]
        title:
          type: string
        key:
          type: string
        state:
          type: string
        source:
          type: [string, 'null']
        confidence:
          type: [number, 'null']
        note:
          type: [string, 'null']
        files:
          type: [array, 'null']
          items:
            type: string
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'
        year:
          type: [integer, 'null']
        library:
          type: string
        series_id:
          type: [string, 'null']
        series_title:
          type: [string, 'null']
        series_tmdb_id:
          type: [integer, 'null']
        season:
          type: [integer, 'null']
        episode:
          type: [integer, 'null']
        episode_end:
          type: [integer, 'null']
    MatchInfo:
      type: object
      required: [id, kind, title, year, state, source, note, candidates, season, episode, part, series_id, series_title, series_tmdb_id, tmdb_id, local, files, manual, file_list, tmdb]
      properties:
        id:
          type: string
        kind:
          type: string
          enum: [movie, series, season, episode]
        title:
          type: string
        year:
          type: [integer, 'null']
        state:
          type: string
          description: '`matched`, `review`, `local`, `manual`, `llm`…'
        source:
          type: [string, 'null']
        note:
          type: [string, 'null']
        candidates:
          type: array
          items:
            $ref: '#/components/schemas/MatchCandidate'
        computed:
          type: boolean
          description: The candidates were found now (`compute=1`).
        season:
          type: [integer, 'null']
        episode:
          type: [integer, 'null']
        part:
          type: [integer, 'null']
          description: A part of an episode split over several files.
        series_id:
          type: [string, 'null']
        series_title:
          type: [string, 'null']
        series_tmdb_id:
          type: [integer, 'null']
        tmdb_id:
          type: [integer, 'null']
        local:
          type: boolean
          description: Named from its files (not matched on TMDB).
        files:
          type: array
          description: Paths (at most 20).
          items:
            type: string
        manual:
          type: boolean
          description: Matched by hand (Back to Automatic forgets it).
        file_list:
          type: array
          description: "A movie's or episode's files, one by one."
          items:
            type: object
            required: [id, name, size, duration, manual, split]
            properties:
              id:
                type: string
              name:
                type: [string, 'null']
              size:
                type: integer
              duration:
                type: [number, 'null']
              manual:
                type: boolean
              split:
                type: boolean
        tmdb:
          type: boolean
          description: The server has a TMDB key (searches work).
    Account:
      type: object
      required: [id, name, is_admin, created_at, devices, last_used, me]
      properties:
        id:
          type: string
        name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: [string, 'null']
          format: date-time
        devices:
          type: integer
          description: Signed-in devices.
        last_used:
          type: [string, 'null']
          format: date-time
        me:
          type: boolean
          description: The account asking.
    AccountDevice:
      type: object
      required: [id, device_name, device_id, created_at, last_used, current]
      properties:
        id:
          type: string
          description: 16 hex characters naming the sign-in (nothing to sign in with).
        device_name:
          type: [string, 'null']
        device_id:
          type: [string, 'null']
        created_at:
          type: [string, 'null']
          format: date-time
        last_used:
          type: [string, 'null']
          format: date-time
        current:
          type: boolean
          description: The device asking.
    Deleted:
      type: object
      required: [deleted]
      properties:
        deleted:
          type: string
    Revoked:
      type: object
      required: [revoked]
      properties:
        revoked:
          type: integer
          description: Devices signed out.
    SystemInfo:
      type: object
      required: [name, version, server_id, started_at, uptime_secs, sizes, cache_max_bytes, downloads_bytes, download_max_bytes, hardware, transcoding, transcode, can_restart, restart_required]
      properties:
        name:
          type: string
        version:
          type: string
        server_id:
          type: string
        started_at:
          type: string
          format: date-time
        uptime_secs:
          type: integer
        sizes:
          type: object
          description: Bytes on disk.
          required: [database, subtitles, artwork, data, cache]
          properties:
            database:
              type: integer
            subtitles:
              type: integer
            artwork:
              type: integer
            data:
              type: integer
            cache:
              type: integer
        cache_max_bytes:
          type: integer
        downloads_bytes:
          type: integer
        download_max_bytes:
          type: integer
        hardware:
          type: object
          required: [nvidia, other_gpus, cpu, ffmpeg]
          additionalProperties: true
          properties:
            nvidia:
              type: array
              items:
                type: object
                required: [vendor]
                properties:
                  vendor:
                    type: string
                  name:
                    type: [string, 'null']
                  driver:
                    type: [string, 'null']
                  memory_mb:
                    type: [integer, 'null']
            other_gpus:
              type: array
              items:
                type: object
                required: [vendor, device, usable]
                properties:
                  vendor:
                    type: string
                  device:
                    type: string
                  usable:
                    type: boolean
            cpu:
              type: object
              required: [model, threads]
              properties:
                model:
                  type: [string, 'null']
                threads:
                  type: integer
            ffmpeg:
              type: [string, 'null']
            encoders:
              type: object
              description: The ffmpeg encoders found, by name.
              additionalProperties:
                type: boolean
        transcoding:
          type: string
          description: What transcodes video.
          enum: [nvenc, qsv, vaapi, videotoolbox, v4l2, cpu, 'off', unavailable]
        transcode:
          type: object
          description: The transcoding backend found at start and its chain.
          required: [backend, label, decode, tonemap, encode, hdr_kept, max_height, requested, notes, available]
          additionalProperties: true
          properties:
            backend:
              type: string
            label:
              type: string
            vendor:
              type: [string, 'null']
            device:
              type: [string, 'null']
            decode:
              type: string
            scale:
              type: string
            tonemap:
              type: string
            encode:
              type: string
            hdr_kept:
              type: boolean
            max_height:
              type: integer
            min_width:
              type: integer
            threads:
              type: integer
            requested:
              type: string
            notes:
              type: array
              items:
                type: string
            available:
              type: boolean
            choices:
              type: array
              description: What `transcode.hardware` may be set to here (`auto` first).
              items:
                type: object
                required: [key, label]
                properties:
                  key:
                    type: string
                  label:
                    type: string
        can_restart:
          type: boolean
        restart_required:
          type: array
          items:
            type: string
    Activity:
      type: object
      required: [sessions, transcodes, transcode_slots, subtitles, index_backfill, trickplay, downloads, scan, errors]
      properties:
        sessions:
          type: array
          description: Playback sessions of the last 90 seconds.
          items:
            type: object
            required: [sid, method, idle_secs]
            additionalProperties: true
            properties:
              sid:
                type: string
              user:
                type: [string, 'null']
              user_id:
                type: [string, 'null']
              item_id:
                type: [string, 'null']
              title:
                type: [string, 'null']
              series_title:
                type: [string, 'null']
              kind:
                type: string
              episode_label:
                type: string
              method:
                type: string
                description: '`copy`, `convert` or `transcode`.'
              variant:
                type: [string, 'null']
              tonemap:
                type: boolean
              duration:
                type: [number, 'null']
              position:
                type: [number, 'null']
              reported_at:
                type: [string, 'null']
                format: date-time
              idle_secs:
                type: integer
        transcodes:
          type: array
          items:
            type: object
            additionalProperties: true
        transcode_slots:
          type: integer
        subtitles:
          type: object
          description: Subtitle extraction now, and the backfill.
          additionalProperties: true
        index_backfill:
          type: object
          description: Keyframe indexes made ahead of need.
          additionalProperties: true
        trickplay:
          type: object
          description: Scrubbing thumbnails made ahead of need.
          additionalProperties: true
        downloads:
          type: array
          items:
            type: object
            additionalProperties: true
        scan:
          type: [object, 'null']
          additionalProperties: true
        errors:
          type: array
          description: The last warnings and errors of the log.
          items:
            type: string
    Service:
      type: object
      required: [id, name, state, summary, with, without]
      properties:
        id:
          type: string
          examples: [tmdb, opensubtitles, llm, ratings, remote_access]
        name:
          type: string
        state:
          type: string
          enum: [configured, builtin, not_set, 'off']
        source:
          type: string
        setting:
          type: string
          description: The setting that turns it on.
        summary:
          type: string
        with:
          type: string
          description: What it gives.
        without:
          type: string
          description: What happens without it.
        account:
          type: boolean
          description: OpenSubtitles signed in with an account.
        quota:
          $ref: '#/components/schemas/SubtitleSearch/properties/quota'
        provider:
          type: string
        provider_name:
          type: string
        model:
          type: [string, 'null']
        review:
          type: integer
        attribution:
          type: string
        imdb_titles:
          type: integer
        critic_titles:
          type: integer
        updated_at:
          type: [string, 'null']
          format: date-time
        address:
          type: [string, 'null']
          description: The server's Tailscale address.
    LlmModel:
      type: object
      required: [id, name]
      properties:
        id:
          type: string
        name:
          type: string
    LlmRequest:
      type: object
      description: Settings to try (nothing saved); what isn't given comes from the server's.
      properties:
        provider:
          type: string
        base_url:
          type: string
        model:
          type: string
        api_key:
          type: string
        output:
          type: string
    ChatGptState:
      type: object
      required: [signed_in]
      properties:
        signed_in:
          type: boolean
        email:
          type: string
        account:
          type: string
          description: The registration in use.
        needs_sign_in:
          type: boolean
        accounts:
          type: array
          items:
            type: object
            required: [id, label, email, signed_in, active]
            properties:
              id:
                type: string
              label:
                type: string
              email:
                type: string
              signed_in:
                type: boolean
              active:
                type: boolean
        unfinished:
          type: array
          description: Registrations whose sign-in never completed.
          items:
            type: object
            required: [id]
            properties:
              id:
                type: string
              kept_at:
                type: [integer, 'null']
    LlmOverview:
      type: object
      required: [presets, current, chatgpt]
      properties:
        presets:
          type: array
          items:
            type: object
            required: [id, name, style, base_url, model, output, key, help, local]
            properties:
              id:
                type: string
              name:
                type: string
              style:
                type: string
              base_url:
                type: string
              model:
                type: string
              output:
                type: string
              key:
                type: string
                enum: [required, optional, sign_in]
              help:
                type: string
              local:
                type: boolean
              saved:
                type: object
                description: Settings kept from when it was chosen before.
                properties:
                  api_key:
                    $ref: '#/components/schemas/SecretState'
                  model:
                    type: string
                  base_url:
                    type: string
                  output:
                    type: string
        current:
          type: object
          required: [provider, base_url, model, output, output_in_use, api_key, keys_aside, enabled]
          properties:
            provider:
              type: string
            base_url:
              type: string
            model:
              type: string
            output:
              type: string
            output_in_use:
              type: [string, 'null']
              description: What `auto` settled on.
            api_key:
              $ref: '#/components/schemas/SecretState'
            keys_aside:
              type: array
              description: Origins this provider has keys kept for, other than its address now.
              items:
                type: string
            enabled:
              type: boolean
        chatgpt:
          $ref: '#/components/schemas/ChatGptState'
