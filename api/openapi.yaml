  /v1/items/{id}/subtitles/{file}:
    get:
      tags: [subtitles]
      operationId: getSubtitleFile
      summary: A whole text track as SRT or WebVTT
      description: Waits for the track to be extracted. The token, or `sid=` of a session playing the title. Capability `subtitle-files`.
      security:
        - bearer: []
        - adminToken: []
        - sessionId: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: file
          in: path
          required: true
          description: '`<index>.srt` or `<index>.vtt`.'
          schema:
            type: string
            pattern: '^[0-9]+\.(srt|vtt)$'
            examples: ['3.srt']
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: The track.
          content:
            application/x-subrip:
              schema:
                type: string
            text/vtt:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/items/{id}/subtitles/{file}/cues:
    get:
      tags: [subtitles]
      operationId: getSubtitleCues
      summary: The cues of one 30-second window of a subtitle track
      description: |
        Window `k` is the file's time [30k, 30k+30). Read for that window alone while the track
        isn't extracted, so a track shows from the first second and right after a seek.
        `complete: true`: the whole track is ready, fetch the `.srt` once instead. The token, or
        `sid=`. Capability `subtitle-windows`.

        A picture track (PGS, DVD, DVB; `text: false`) answers the same way, with images: the
        window's `canvas` (the frame the pictures are placed on, which the app scales onto the
        video it shows, width and height separately) and each cue's `image` (its place on the
        canvas and a PNG, base64). `text` is empty and `complete` is always false. The video
        plays as it is: nothing is burned in. Capability `subtitle-pictures`.
      security:
        - bearer: []
        - adminToken: []
        - sessionId: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: file
          in: path
          required: true
          description: The track index.
          schema:
            type: integer
        - name: window
          in: query
          description: The window number (this or `at`).
          schema:
            type: integer
            minimum: 0
        - name: at
          in: query
          description: Seconds into the file (instead of `window`).
          schema:
            type: number
            minimum: 0
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: The window's cues.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CueWindow'
              examples:
                window0:
                  $ref: examples/subtitle-cues.json
                pictures:
                  $ref: examples/subtitle-picture-cues.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/items/{id}/subtitles/{file}/timing:
    get:
      tags: [subtitles]
      operationId: getSubtitleTiming
      summary: How a text track's timing stands
      description: |
        A downloaded track is matched to the file (asking starts it; `pending` while it runs); the
        viewer's `nudge` is applied by the app itself. Capability `subtitle-sync` (the match),
        `subtitle-timing` (the nudge).
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: file
          in: path
          required: true
          description: The track index.
          schema:
            type: integer
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: The timing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitleTiming'
              examples:
                own:
                  $ref: examples/subtitle-timing.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [subtitles]
      operationId: setSubtitleTiming
      summary: Keep a nudge, or the original timing, for every device
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: file
          in: path
          required: true
          description: The track index.
          schema:
            type: integer
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                nudge:
                  type: number
                  description: Seconds, positive is later (at most an hour either way).
                original:
                  type: boolean
                  description: Play the track with its original timing, not the match.
      responses:
        '200':
          description: The timing now.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitleTiming'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/items/{id}/subtitles/search:
    get:
      tags: [subtitles]
      operationId: searchSubtitles
      summary: Search OpenSubtitles for the title
      description: |
        By the title's ids and the file's hash (hash matches first); `q` searches by text instead.
        `fetched` marks results already fetched for this title. Capability `subtitle-search`.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - name: lang
          in: query
          description: ISO 639-1 codes, comma-separated.
          schema:
            type: string
            default: en
        - name: q
          in: query
          schema:
            type: string
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: The results.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitleSearch'
              examples:
                results:
                  $ref: examples/subtitle-search.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/items/{id}/subtitles/fetch:
    post:
      tags: [subtitles]
      operationId: fetchSubtitle
      summary: Fetch a search result; it becomes a track of the title for every device
      description: '`429` when the day''s downloads are used up.'
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result_id]
              properties:
                result_id:
                  type: string
                  description: A search result's `id`.
                language:
                  type: string
                name:
                  type: string
                hearing_impaired:
                  type: boolean
      responses:
        '200':
          description: The new track.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitleTrack'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '502':
          $ref: '#/components/responses/BadGateway'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/items/{id}/subtitles/upload:
    post:
      tags: [subtitles]
      operationId: uploadSubtitle
      summary: Add a subtitle file the device has as a track of the title
      description: The same text is stored once. The track is then in the stream too, as a rendition.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [srt]
              properties:
                srt:
                  type: string
                  description: The file's text, SRT.
                language:
                  type: string
                name:
                  type: string
      responses:
        '200':
          description: The new track.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubtitleTrack'
              examples:
                uploaded:
                  $ref: examples/subtitle-track.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'

  /v1/items/{id}/trickplay:
    get:
      tags: [trickplay]
      operationId: getTrickplay
      summary: A title's scrubbing thumbnails
      description: |
        Sheets of `columns` × `rows` pictures, one every `interval` seconds: picture `i` is on
        sheet `i / (columns × rows)`, at column `i % columns` and row `(i / columns) % rows`.
        `pending`: not made yet (the title moves to the front of the queue); `off`: switched off.
        The token, or `sid=` of a session playing the title (then the file it plays). Capability
        `trickplay`.
      security:
        - bearer: []
        - adminToken: []
        - sessionId: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          description: The thumbnails' layout.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Trickplay'
              examples:
                ready:
                  $ref: examples/trickplay.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/trickplay/{key}/{file}:
    get:
      tags: [trickplay]
      operationId: getTrickplaySheet
      summary: A sheet of thumbnails
      description: The URLs come from `sheets`. They never change (`Cache-Control … immutable`). The token, or `sid=`.
      security:
        - bearer: []
        - adminToken: []
        - sessionId: []
      parameters:
        - name: key
          in: path
          required: true
          schema:
            type: string
        - name: file
          in: path
          required: true
          description: '`<n>.jpg`'
          schema:
            type: string
            pattern: '^[0-9]+\.jpg$'
      responses:
        '200':
          description: The sheet.
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/items/{id}/download:
    get:
      tags: [downloads]
      operationId: downloadOriginal
      summary: The original file
      description: With `Range`, `If-Range`, `ETag` and `Last-Modified`, so a download resumes. Capability `download-original`.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Version'
      responses:
        '200':
          $ref: '#/components/responses/File'
        '206':
          $ref: '#/components/responses/File'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/items/{id}/download-jobs:
    post:
      tags: [downloads]
      operationId: createDownloadJob
      summary: Prepare a progressive MP4
      description: |
        The copied video (remuxed) or a transcoded variant, and the audio tracks asked for.
        `202` with a new job, `200` with an existing one for the same file and options; `422` when
        it can't be made, `507` when the download space is full. Capability `download-jobs`.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Version'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadJobParams'
      responses:
        '200':
          $ref: '#/components/responses/DownloadJob'
        '202':
          $ref: '#/components/responses/DownloadJob'
        '400':
          description: The body isn't JSON (the text says how).
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
        '507':
          description: The download space is full.
          content:
            text/plain:
              schema:
                type: string
  /v1/download-jobs:
    get:
      tags: [downloads]
      operationId: listDownloadJobs
      summary: The prepared downloads, and the space they take
      responses:
        '200':
          description: The jobs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DownloadJobList'
              examples:
                one:
                  $ref: examples/download-jobs.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/download-jobs/{job}:
    get:
      tags: [downloads]
      operationId: getDownloadJob
      summary: A job's state and progress
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          $ref: '#/components/responses/DownloadJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags: [downloads]
      operationId: deleteDownloadJob
      summary: Drop a job and its file
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '204':
          description: Dropped.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/download-jobs/{job}/file:
    get:
      tags: [downloads]
      operationId: getDownloadJobFile
      summary: A finished job's file (`Range`)
      description: The random job id is the credential; no token needed. `409` while the job isn't done.
      security: []
      parameters:
        - $ref: '#/components/parameters/JobId'
      responses:
        '200':
          $ref: '#/components/responses/File'
        '206':
          $ref: '#/components/responses/File'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/items/{id}/offline:
    get:
      tags: [downloads]
      operationId: describeOfflineSet
      summary: What to download for a segmented offline set
      description: |
        The same fMP4 HLS segments as a stream, fetched one by one and played on the device while
        they come in. A set is the title, its file version and one video variant (the best within
        `quality`, the original without); the audio tracks asked for (else one per language, the
        default first, at most 4; none for a title with no audio track) and the text subtitles. Playlists have URIs relative to `base`.
        Capability `offline-sets`.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/StreamQuality'
        - $ref: '#/components/parameters/StreamHdr'
        - name: audio
          in: query
          description: Comma-separated audio track indices, the first the default.
          schema:
            type: string
        - $ref: '#/components/parameters/StreamLossless'
      responses:
        '200':
          description: The set.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OfflineSet'
              examples:
                original:
                  $ref: examples/offline.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/items/{id}/offline/{variant}/video/{file}:
    get:
      tags: [downloads]
      operationId: offlineVideoFile
      summary: An offline set's video init section or segment
      description: '`503`: the transcode slots are busy, ask again later.'
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/SegmentFile'
        - $ref: '#/components/parameters/OfflineVersion'
      responses:
        '200':
          $ref: '#/components/responses/Mp4'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FileChanged'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/items/{id}/offline/{variant}/audio/{index}/{file}:
    get:
      tags: [downloads]
      operationId: offlineAudioFile
      summary: An offline set's audio init section or segment
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/TrackIndex'
        - $ref: '#/components/parameters/SegmentFile'
        - $ref: '#/components/parameters/OfflineVersion'
      responses:
        '200':
          $ref: '#/components/responses/Mp4'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FileChanged'
  /v1/items/{id}/offline/{variant}/subs/{index}/cues.vtt:
    get:
      tags: [downloads]
      operationId: offlineSubtitleFile
      summary: An offline set's subtitle track, whole, as WebVTT
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/VariantId'
        - $ref: '#/components/parameters/TrackIndex'
        - $ref: '#/components/parameters/OfflineVersion'
      responses:
        '200':
          $ref: '#/components/responses/WebVtt'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/FileChanged'

  /:
    get:
      tags: [setup]
      operationId: setupPage
      summary: The server's page (its setup code, while not set up)
      description: |
        A web page for people, not for apps. On a server with no accounts it shows the setup code,
        to clients on the local network only; once set up, it only says so.
      security: []
      responses:
        '200':
          description: The page.
          content:
            text/html:
              schema:
                type: string
  /v1/setup/verify:
    post:
      tags: [setup]
      operationId: verifySetupCode
      summary: Is this the setup code
      description: |
        Checks the 6-digit setup code of an unclaimed server (`setup: unclaimed` in `/v1/info`),
        before the app asks for a user name and password. Wrong codes: 5 per client address in 15
        minutes, then 429; after 10 in all the server makes a new code (in its log). Capability
        `setup-claim`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code:
                  type: string
                  description: The 6 digits (spaces are ignored).
      responses:
        '204':
          description: The right code.
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Not the code.
          content:
            text/plain:
              schema:
                type: string
        '409':
          description: The server is set up already.
          content:
            text/plain:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/setup/claim:
    post:
      tags: [setup]
      operationId: claimServer
      summary: Set up a new server (its first account, an admin)
      description: |
        Creates the first account, an admin, with the setup code, and signs it in on this device
        (as `/v1/auth/login` answers). The server is claimed from then on; the code is gone.
        Capability `setup-claim`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, username, password]
              properties:
                code:
                  type: string
                username:
                  type: string
                password:
                  type: string
                device_id:
                  type: string
                device_name:
                  type: string
      responses:
        '200':
          description: Set up, and signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
              examples:
                claimed:
                  $ref: examples/setup-claim.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          description: Not the code.
          content:
            text/plain:
              schema:
                type: string
        '409':
          description: The server is set up already.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: The user name or password isn't allowed (the code isn't used up).
          content:
            text/plain:
              schema:
                type: string
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/admin/settings:
    get:
      tags: [admin]
      operationId: getSettings
      summary: The server's settings, and where each comes from
      description: |
        `settings`: the values, nested (`server.name`, `metadata.*`, `tmdb.*`, `opensubtitles.*`,
        `llm.*`, `performance.*`, `features.*`…); a secret shows only whether it is set
        (`{set, last4?}`; `builtin` for a built-in key). `fields["<dotted key>"]`: its `source`, the
        environment variable that sets it (`env`), when a change applies (`apply`) and
        `restart_pending`. Environment variables win over stored settings.
      responses:
        '200':
          description: The settings document.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SettingsDocument'
              examples:
                new:
                  $ref: examples/admin-settings.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
    patch:
      tags: [admin]
      operationId: updateSettings
      summary: Change settings
      description: |
        The document's shape, partial, nested or with dotted keys (`{"metadata.country": "GB"}`);
        `null` or `""` removes a value (back to the default). A secret's masked form given back is
        ignored; a key given twice is refused. Applied at once where possible (`apply: live`).
        Libraries are changed with `/v1/admin/libraries`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
            example:
              server.name: Living Room
              metadata:
                country: GB
      responses:
        '200':
          description: The settings document after the change, and what changed.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SettingsDocument'
                  - type: object
                    required: [changed, overridden_by_env]
                    properties:
                      changed:
                        type: array
                        description: The dotted keys whose effective value changed.
                        items:
                          type: string
                      overridden_by_env:
                        type: array
                        description: Stored, but an environment variable wins.
                        items:
                          type: string
        '400':
          description: Not a JSON object, or a value isn't allowed (the text lists each problem); nothing is changed.
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'

  /v1/admin/libraries:
    get:
      tags: [admin]
      operationId: listManagedLibraries
      summary: The libraries and their folders
      description: Each folder (`roots`) with its state at the last scan pass.
      responses:
        '200':
          description: The libraries.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedLibraryList'
              examples:
                three:
                  $ref: examples/admin-libraries.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
    post:
      tags: [admin]
      operationId: createLibrary
      summary: Add a library
      description: |
        Every folder is checked first (a share is signed in to and its folder listed: it must exist
        and hold something; 400 says which can't be used). A full scan starts. 409 while the
        libraries come from `MOONRISE_LIBRARIES`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LibraryRequest'
      responses:
        '201':
          description: The library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedLibraryChanged'
              examples:
                added:
                  $ref: examples/admin-library.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/libraries/{id}:
    parameters:
      - $ref: '#/components/parameters/LibraryId'
    get:
      tags: [admin]
      operationId: getManagedLibrary
      summary: A library and its folders
      responses:
        '200':
          description: The library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedLibrary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [admin]
      operationId: updateLibrary
      summary: Rename a library, or change its folders
      description: '`roots` replaces the folders as a whole (each one checked; a full scan follows).'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                roots:
                  type: array
                  items:
                    $ref: '#/components/schemas/LibraryRootRequest'
      responses:
        '200':
          description: The library.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedLibraryChanged'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
    delete:
      tags: [admin]
      operationId: deleteLibrary
      summary: Remove a library (and its titles)
      responses:
        '200':
          description: Removed; the libraries now.
          content:
            application/json:
              schema:
                type: object
                required: [deleted, libraries]
                properties:
                  deleted:
                    type: string
                  libraries:
                    $ref: '#/components/schemas/ManagedLibraryList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /v1/admin/fs/browse:
    get:
      tags: [admin]
      operationId: browseServerFolders
      summary: "The server's folders, for picking a library's folder"
      description: |
        Without `path`: the folders browsing may start at (`MOONRISE_BROWSE_ROOTS`, or every
        top-level folder but the system's and the server's own). With one: its sub-folders and how
        many video files it holds directly. Names only, never file contents.
      parameters:
        - name: path
          in: query
          schema:
            type: string
      responses:
        '200':
          description: The folder.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FolderListing'
              examples:
                folder:
                  $ref: examples/admin-fs-browse.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/admin/smb/discover:
    get:
      tags: [admin]
      operationId: discoverFileServers
      summary: File servers on the local network
      description: Bonjour (`_smb._tcp`) and NetBIOS, for `wait_ms`.
      parameters:
        - name: wait_ms
          in: query
          schema:
            type: integer
            minimum: 300
            maximum: 10000
            default: 2000
      responses:
        '200':
          description: The servers found.
          content:
            application/json:
              schema:
                type: object
                required: [servers]
                properties:
                  servers:
                    type: array
                    items:
                      type: object
                      required: [name, host, addresses, via]
                      properties:
                        name:
                          type: string
                        host:
                          type: string
                          description: What to connect to (an address).
                        addresses:
                          type: array
                          items:
                            type: string
                        via:
                          type: array
                          items:
                            type: string
                            enum: [mdns, netbios]
              examples:
                one:
                  $ref: examples/admin-smb-discover.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
  /v1/admin/smb/shares:
    post:
      tags: [admin]
      operationId: listShares
      summary: "A file server's shares"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [host]
                  properties:
                    host:
                      type: string
                - $ref: '#/components/schemas/SmbLogin'
      responses:
        '200':
          description: The shares.
          content:
            application/json:
              schema:
                type: object
                required: [host, guest, shares]
                properties:
                  host:
                    type: string
                  guest:
                    type: boolean
                    description: Listed without a login.
                  shares:
                    type: array
                    items:
                      type: object
                      required: [name, comment]
                      properties:
                        name:
                          type: string
                        comment:
                          type: string
              examples:
                two:
                  $ref: examples/admin-smb-shares.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/AdminsOnly'
        '404':
          $ref: '#/components/responses/SmbNotFound'
        '422':
          $ref: '#/components/responses/SmbRefused'
        '502':
          $ref: '#/components/responses/SmbUnreachable'
  /v1/admin/smb/browse:
    post:
      tags: [admin]
      operationId: browseShare
      summary: "A share's folder: its sub-folders and video count"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/SmbTarget'
                - $ref: '#/components/schemas/SmbLogin'
      responses:
        '200':
          description: The folder.
          content:
            application/json:
              schema:
