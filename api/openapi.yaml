openapi: 3.1.0
info:
  title: Moonrise server API
  version: 0.29.0
  summary: The HTTP API a Moonrise client uses to browse, play, keep watch state and manage the server.
  description: |
    The contract between the Moonrise server (`server/`) and its clients. A server test
    (`server/src/api_contract_tests.rs`) fails when a route of the server's router is missing here,
    or when this file names one the router lacks; `scripts/api-lint.sh` (in `make check`) validates
    the file and its examples, and the clients' tests decode every example with their own models
    (`clients/apple/MoonriseTests/APIExamplesTests.swift`,
    `clients/android/core/src/test/kotlin/app/moonrise/core/APIExamplesTest.kt`).

    The admin API (`/v1/admin/…`, tag `admin`) is for admins only: an admin's token, or the
    command line's local admin token (`X-Moonrise-Admin`). Others get 403. A new server is set up
    with its setup code (tag `setup`).

    Conventions:
    - JSON is snake_case. Lists are `{items, total}`. Times are seconds (floating point), dates
      RFC 3339 (`2026-11-08T20:49:34.000Z`), unless a field says Unix seconds.
    - Answers only gain fields over time: ignore the ones you don't know.
    - Errors are plain text (`text/plain`), with the status saying what kind.
    - **Capabilities**: `GET /v1/info` lists what the server can do. Check a capability before
      using what it names (the operations below say which), so a client works with older servers.
      New stream features are asked for by a query flag (`dv`, `lossless`, `trick`, `abr`, …);
      without the flag the output is what older clients always got.
    - Ids: items, files and users are the server's own ids (ULIDs). A merged item's old id still
      answers, with the new item. Where an item id is taken, `<item id>~<file id>` (or the
      `version` parameter) picks one of its files.

    The order to build a client in, and the rules both clients keep: `docs/dev/adding-a-client.md`.
    How each part works inside the server: `docs/dev/server.md`.
  license:
    name: MPL-2.0
    identifier: MPL-2.0
servers:
  - url: http://{host}:{port}
    description: A Moonrise server on the local network (found by Bonjour `_moonrise._tcp`).
    variables:
      host:
        default: 192.168.1.20
      port:
        default: '8097'
security:
  - bearer: []
  - adminToken: []
tags:
  - name: server
    description: Finding the server and what it can do.
  - name: auth
    description: Signing in, with a password, a device code or an invitation.
  - name: browse
    description: Libraries, titles, shows, search, the home screen and artwork.
  - name: playback
    description: Opening a title as HLS, and the playback session's streams.
  - name: watch state
    description: Reports of what is watched, played marks, versions and Continue Watching.
  - name: subtitles
    description: Subtitle tracks, cues, timing, search and upload.
  - name: trickplay
    description: Scrubbing thumbnails.
  - name: downloads
    description: The original file, prepared MP4 files and segmented offline sets.
  - name: setup
    description: Setting up a new server with its setup code.
  - name: admin
    description: Managing the server (admins only) — libraries and their folders, network shares, scans, Fix Match, accounts, invitations, services, settings, what it is doing.

paths:
  /health:
    get:
      tags: [server]
      operationId: health
      summary: Is the server up
      description: Answers exactly `ok`.
      security: []
      responses:
        '200':
          description: The server is up.
          content:
            text/plain:
              schema:
                type: string
                const: ok
  /v1/info:
    get:
      tags: [server]
      operationId: getInfo
      summary: What the server is and can do
      description: No token needed. A client asks this first, and on every start.
      security: []
      responses:
        '200':
          description: The server.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Info'
              examples:
                unclaimed:
                  $ref: examples/info.json
  /v1/jobs:
    get:
      tags: [server]
      operationId: getJobs
      summary: Work in progress (for checks)
      description: Transcode runs and subtitle extraction in progress. Diagnostic; its fields may change.
      security: []
      responses:
        '200':
          description: The work in progress.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jobs'

  /v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Sign in with a user name and password
      description: Rate-limited per address and per user name (10 failures in 15 minutes).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
              examples:
                signedIn:
                  $ref: examples/sign-in.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Sign out (revoke this token)
      security:
        - bearer: []
      responses:
        '204':
          description: The token is revoked.
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/me:
    get:
      tags: [auth]
      operationId: getMe
      summary: The signed-in account and this device
      security:
        - bearer: []
      responses:
        '200':
          description: The account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
              examples:
                me:
                  $ref: examples/me.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /v1/auth/device:
    post:
      tags: [auth]
      operationId: startDeviceCode
      summary: Start signing in with a device code (TVs)
      description: |
        Show `user_code` and `verify_url` (or a QR code of `verify_url_complete`); the user approves
        it in a signed-in app (`/v1/auth/device/approve`) or on the `/link` page. Then poll
        `/v1/auth/device/poll` every `interval` seconds. Capability `device-code`. The body is
        optional.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceRequest'
      responses:
        '200':
          description: The codes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCode'
              examples:
                code:
                  $ref: examples/device-code.json
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/device/poll:
    post:
      tags: [auth]
      operationId: pollDeviceCode
      summary: Whether the device code has been approved
      description: '`approved` carries the token, once. `slow_down`: poll less often (every `interval` seconds).'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [device_code]
              properties:
                device_code:
                  type: string
      responses:
        '200':
          description: Where the code stands.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DevicePoll'
              examples:
                approved:
                  $ref: examples/device-poll-approved.json
                pending:
                  summary: Not approved yet
                  value:
                    status: pending
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/auth/device/approve:
    post:
      tags: [auth]
      operationId: approveDeviceCode
      summary: Approve a device code from a signed-in app
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [user_code]
              properties:
                user_code:
                  type: string
                  examples: [ABCD-1234]
      responses:
        '200':
          description: Approved.
          content:
            application/json:
              schema:
                type: object
                required: [approved, device_name]
                properties:
                  approved:
                    type: boolean
                    const: true
                  device_name:
                    type: [string, 'null']
              examples:
                approved:
                  summary: Approved
                  value:
                    approved: true
                    device_name: Example TV
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /v1/auth/invite:
    post:
      tags: [auth]
      operationId: redeemInvite
      summary: Create an account with an invitation code
      description: Capability `invites`. Wrong codes are rate-limited like passwords.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteRequest'
      responses:
        '200':
          description: The new account, signed in.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SignIn'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/Unavailable'
  /link:
    get:
      tags: [auth]
      operationId: linkPage
      summary: The page that approves a device code from any browser
      description: A plain HTML form (code, user name, password).
      security: []
      parameters:
        - name: code
          in: query
          description: The code, filled in (the TV's QR code links here with it).
          schema:
            type: string
      responses:
        '200':
          description: The form.
          content:
            text/html:
              schema:
                type: string
    post:
      tags: [auth]
      operationId: linkSubmit
      summary: Approve a device code with a user name and password
      description: |
        The form's submission. CSRF: the `csrf` field must match the page's SameSite=Strict cookie,
        and the `Origin` must be this server. Rate-limited like sign-in.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [code, username, password, csrf]
              properties:
                code:
                  type: string
                username:
                  type: string
                password:
                  type: string
                csrf:
                  type: string
      responses:
        '200':
          description: The page, saying whether the device is signed in.
          content:
            text/html:
              schema:
                type: string
        '400':
          description: The form, with what was wrong.
          content:
            text/html:
              schema:
                type: string

  /v1/libraries:
    get:
      tags: [browse]
      operationId: listLibraries
      summary: The libraries
      description: Libraries have no type; `kind` and `collection_type` are kept for older apps.
      responses:
        '200':
          description: The libraries, in their order.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LibraryList'
              examples:
                one:
                  $ref: examples/libraries.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/libraries/{id}/latest:
    get:
      tags: [browse]
      operationId: libraryLatest
      summary: A library's newest titles
      description: For a signed-in user, watched titles are left out. New episodes are grouped into their show.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: The titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
              examples:
                latest:
                  $ref: examples/latest.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/libraries/{id}/facets:
    get:
      tags: [browse]
      operationId: libraryFacets
      summary: What a library's filters can pick, with counts
      description: Takes the filters of `GET /v1/items`; each facet is counted under the other filters, not its own.
      parameters:
        - $ref: '#/components/parameters/LibraryId'
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, series]
        - $ref: '#/components/parameters/RecentDays'
        - $ref: '#/components/parameters/FilterGenre'
        - $ref: '#/components/parameters/FilterGenreMatch'
        - $ref: '#/components/parameters/FilterRating'
        - $ref: '#/components/parameters/FilterStudio'
        - $ref: '#/components/parameters/FilterCollection'
        - $ref: '#/components/parameters/FilterYearFrom'
        - $ref: '#/components/parameters/FilterYearTo'
        - $ref: '#/components/parameters/FilterResolution'
        - $ref: '#/components/parameters/FilterHdr'
        - $ref: '#/components/parameters/FilterUnplayed'
        - $ref: '#/components/parameters/FilterPlayed'
        - $ref: '#/components/parameters/FilterInProgress'
        - $ref: '#/components/parameters/FilterAddedDays'
        - $ref: '#/components/parameters/FilterOnly'
      responses:
        '200':
          description: The facets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facets'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/facets:
    get:
      tags: [browse]
      operationId: facets
      summary: What the filters can pick for movies or shows, across libraries
      description: As a library's facets, over all libraries; `library=<id>` is one of the filters. Capability `library-filters`.
      parameters:
        - name: type
          in: query
          schema:
            type: string
            enum: [movie, series]
            default: movie
        - $ref: '#/components/parameters/RecentDays'
        - $ref: '#/components/parameters/FilterLibrary'
        - $ref: '#/components/parameters/FilterGenre'
        - $ref: '#/components/parameters/FilterGenreMatch'
        - $ref: '#/components/parameters/FilterRating'
        - $ref: '#/components/parameters/FilterStudio'
        - $ref: '#/components/parameters/FilterCollection'
        - $ref: '#/components/parameters/FilterYearFrom'
        - $ref: '#/components/parameters/FilterYearTo'
        - $ref: '#/components/parameters/FilterResolution'
        - $ref: '#/components/parameters/FilterHdr'
        - $ref: '#/components/parameters/FilterUnplayed'
        - $ref: '#/components/parameters/FilterPlayed'
        - $ref: '#/components/parameters/FilterInProgress'
        - $ref: '#/components/parameters/FilterAddedDays'
        - $ref: '#/components/parameters/FilterOnly'
      responses:
        '200':
          description: The facets.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Facets'
              examples:
                movies:
                  $ref: examples/facets.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/items:
    get:
      tags: [browse]
      operationId: listItems
      summary: Browse titles
      description: |
        Movies and shows (or seasons, episodes) across libraries, filtered and sorted. Or `ids=` for
        those titles in that order, or `parent=` for a show's seasons and episodes or a season's
        episodes. A title sort answers `index` too (where each letter starts in the whole list).
      parameters:
        - name: type
          in: query
          description: Comma-separated kinds. Default `movie` (or, with `library` alone, what that library was made as).
          schema:
            type: string
            examples: ['movie', 'series', 'movie,series']
        - $ref: '#/components/parameters/FilterLibrary'
        - name: ids
          in: query
          description: Comma-separated item ids (at most 200), answered in this order.
          schema:
            type: string
        - name: parent
          in: query
          description: A series' or season's id.
          schema:
            type: string
        - name: sort
          in: query
          schema:
            type: string
            enum: [title, added, year, rating, played, runtime]
            default: title
        - name: order
          in: query
          description: Default `asc` for a title sort, `desc` for the others.
          schema:
            type: string
            enum: [asc, desc]
        - $ref: '#/components/parameters/Offset'
        - $ref: '#/components/parameters/Limit'
        - $ref: '#/components/parameters/FilterGenre'
        - $ref: '#/components/parameters/FilterGenreMatch'
        - $ref: '#/components/parameters/FilterRating'
        - $ref: '#/components/parameters/FilterStudio'
        - $ref: '#/components/parameters/FilterCollection'
        - $ref: '#/components/parameters/FilterYearFrom'
        - $ref: '#/components/parameters/FilterYearTo'
        - $ref: '#/components/parameters/FilterResolution'
        - $ref: '#/components/parameters/FilterHdr'
        - $ref: '#/components/parameters/FilterUnplayed'
        - $ref: '#/components/parameters/FilterPlayed'
        - $ref: '#/components/parameters/FilterInProgress'
        - $ref: '#/components/parameters/FilterAddedDays'
        - $ref: '#/components/parameters/FilterOnly'
      responses:
        '200':
          description: A page of titles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
              examples:
                byTitle:
                  $ref: examples/items.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/items/{id}:
    get:
      tags: [browse]
      operationId: getItem
      summary: One title, with its files, tracks, versions, people and chapters
      description: |
        A title with several files has versions (capability `versions`): each file's `version`
        tells it from the others, and for a signed-in user `position` is where they stopped in it
        and `user.version` the one they chose. A merged id answers with the new item
        (`requested_id` is the id asked for).
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: The title.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemDetail'
              examples:
                movie:
                  $ref: examples/item-movie.json
                episode:
                  $ref: examples/item-episode.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/items/{id}/segments:
    get:
      tags: [browse]
      operationId: getSegments
      summary: Intro, recap, credits and preview of the version played
      description: |
        From chapter names, and for an episode without a credits chapter the end credits found in
        the file (`source: detected`; `pending: true` while they are being looked for).
        Capability `segments`.

        With `merged=1` (capability `segments-merged`, server 0.28): the segments the player
        offers, the file's merged with the community databases' (TheIntroDB, IntroDB) by the
        segment rules (`api/segment-rules.json`, ADR 0005), which the server looks up and keeps
        itself; the apps contact no other service. The answer never waits for a lookup:
        `community_pending: true` while the title waits for one (ask again a few seconds later);
        no end credits are offered until then.
        Without `merged` the answer is the file's alone, as before.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Version'
        - name: merged
          in: query
          required: false
          description: '`1`: the merged segments the player offers (capability `segments-merged`).'
          schema:
            type: string
            enum: ['1']
        - name: provisional
          in: query
          required: false
          description: >-
            With `merged=1`: use the databases' end credits while the file is still being looked at
            (`pending`), as a download saved now does.
          schema:
            type: string
            enum: ['1']
        - name: community
          in: query
          required: false
          description: 'With `merged=1`, `0`: leave the community databases out (the device''s setting).'
          schema:
            type: string
            enum: ['0']
      responses:
        '200':
          description: The segments.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segments'
              examples:
                chapters:
                  $ref: examples/segments.json
                merged:
                  $ref: examples/segments-merged.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/shows/{id}/seasons:
    get:
      tags: [browse]
      operationId: getSeasons
      summary: A show's seasons
      description: Specials last.
      parameters:
        - $ref: '#/components/parameters/ShowId'
      responses:
        '200':
          description: The seasons.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
              examples:
                seasons:
                  $ref: examples/seasons.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/shows/{id}/episodes:
    get:
      tags: [browse]
      operationId: getEpisodes
      summary: A show's episodes, in airing order
      description: Specials last. Each episode has its `ratings` when there are any.
      parameters:
        - $ref: '#/components/parameters/ShowId'
        - name: season
          in: query
          description: A season number, or a season's id. Without it, every season.
          schema:
            type: string
      responses:
        '200':
          description: The episodes.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ItemList'
              examples:
                season1:
                  $ref: examples/episodes.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/search:
    get:
      tags: [browse]
      operationId: search
      summary: Search titles and episodes
      description: Every word a prefix, diacritics ignored. At most 40 titles and 20 episodes. Capability `search`.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: What was found.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResults'
              examples:
                bunny:
                  $ref: examples/search.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/search/start:
    get:
      tags: [browse]
      operationId: searchStart
      summary: What Search offers before anything is typed
      description: |
        `recent`: the titles this user opened from Search, newest first, on every device (at most
        20). `suggestions`: movies and shows from the library they haven't started, those in the
        genres they watch most first, then best rated, movies and shows taking turns (at most 20);
        without any watch history, best rated. Capability `search-start`.
      responses:
        '200':
          description: The two rows; either can be empty.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchStart'
              examples:
                start:
                  $ref: examples/search-start.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/search/recent:
    delete:
      tags: [browse]
      operationId: clearSearchRecent
      summary: Forget the titles opened from Search, on every device
      description: Capability `search-start`. `cleared` is how many titles there were.
      security:
        - bearer: []
      responses:
        '200':
          description: Cleared.
          content:
            application/json:
              schema:
                type: object
                required: [cleared]
                properties:
                  cleared:
                    type: integer
              examples:
                cleared:
                  $ref: examples/search-recent-cleared.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/search/recent/{id}:
    put:
      tags: [browse]
      operationId: recordSearchRecent
      summary: A title was opened from Search
      description: Puts it first in the user's Recent. Movies, shows and episodes count. Capability `search-start`.
      security:
        - bearer: []
      parameters:
        - $ref: '#/components/parameters/ItemId'
      responses:
        '200':
          description: Recorded.
          content:
            application/json:
              schema:
                type: object
                required: [recorded]
                properties:
                  recorded:
                    type: boolean
                    const: true
              examples:
                recorded:
                  $ref: examples/search-recent-recorded.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: No such title.
  /v1/home:
    get:
      tags: [browse]
      operationId: getHome
      summary: The home screen in one request
      description: |
        `continue` is the Continue Watching row (each with `continue`: why it is there);
        `latest_types` the newest movies and shows across libraries. `resume`, `next_up` and
        `latest` (per library) are for older apps. The watch-state rows need a Moonrise account
        token (empty otherwise, with a note).
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: watching
          in: query
          description: |
            `1` or `true`: only the rows of what is being watched. `latest_types` and `latest` come
            back empty, for a client that follows Continue Watching in the background.
          schema:
            type: string
      responses:
        '200':
          description: The rows.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Home'
              examples:
                nextEpisode:
                  $ref: examples/home.json
        '401':
          $ref: '#/components/responses/Unauthorized'
  /v1/images/{id}:
    get:
      tags: [browse]
      operationId: getImage
      summary: Artwork
      description: |
        No token needed: the id is a hash of the image's source, so the answer never changes
        (`Cache-Control: public, max-age=31536000, immutable`). Capability `images`.
      security: []
      parameters:
        - name: id
          in: path
          required: true
          description: An image id from `images`, `parent_images`, `backdrop` or a person's `image`.
          schema:
            type: string
        - name: w
          in: query
          description: Width in pixels (smaller copies are made and kept).
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: The image.
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/NotFound'
        '502':
          $ref: '#/components/responses/BadGateway'

  /v1/items/{id}/playback:
    get:
      tags: [playback]
      operationId: getPlayback
      summary: Open a title for playback
      description: |
        Answers what can be served and, when it can, `master`: the master playlist of a new
        playback session (a URL relative to the server). The stream URLs carry the session id
        instead of the token, so a player fetches them without headers. `pending: true`: the
        keyframe index is being made, ask again shortly. `supported: false` with `reasons` when it
        can't be served as asked. Track indices are the library's (sidecar files first).
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/StreamStart'
        - $ref: '#/components/parameters/StreamHdr'
        - $ref: '#/components/parameters/StreamQuality'
        - $ref: '#/components/parameters/StreamAbr'
        - $ref: '#/components/parameters/StreamDv'
        - $ref: '#/components/parameters/StreamLossless'
        - $ref: '#/components/parameters/StreamTrick'
      responses:
        '200':
          description: How the title is served.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playback'
              examples:
                copy:
                  $ref: examples/playback.json
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/items/{id}/master.m3u8:
    get:
      tags: [playback]
      operationId: getItemMaster
      summary: Open a title, straight to its master playlist
      description: The same as `/playback`, answering the master playlist itself.
      parameters:
        - $ref: '#/components/parameters/ItemId'
        - $ref: '#/components/parameters/Version'
        - $ref: '#/components/parameters/StreamStart'
        - $ref: '#/components/parameters/StreamHdr'
        - $ref: '#/components/parameters/StreamQuality'
        - $ref: '#/components/parameters/StreamAbr'
        - $ref: '#/components/parameters/StreamDv'
        - $ref: '#/components/parameters/StreamLossless'
        - $ref: '#/components/parameters/StreamTrick'
      responses:
        '200':
          $ref: '#/components/responses/Playlist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
  /v1/s/{sid}:
    delete:
