  /v1/sessions/{sid}/{event}:
    post:
      tags: [watch state]
      operationId: reportPlayback
      summary: Report playback (start, every 10 s, stop)
      description: |
        The server keeps the resume point and marks titles played; keep no watch state on the
        device. `outcome`: what this report did (`resume`: a resume point kept, `played`, `cleared`:
        too early for one). Capability `playback-reporting`. The body is optional for `start`.
        `tracks` (capability `track-memory`): the audio and subtitle tracks playing, kept for the
        session's file; the playback answer's `tracks` gives them back.
      parameters:
        - $ref: '#/components/parameters/SessionId'
        - name: event
          in: path
          required: true
          schema:
            type: string
            enum: [start, progress, stop]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Report'
      responses:
        '200':
          description: What the report did.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReportResult'
              examples:
                progress:
                  $ref: examples/report.json
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: The session is another account's.
          content:
            text/plain:
              schema:
                type: string
        '404':
          description: No such event, or no such session.
          content:
            text/plain:
              schema:
                type: string
        '422':
          description: "The session's title isn't in the Moonrise library (nothing to keep watch state for)."
          content:
            text/plain:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/sessions/local:
    post:
      tags: [watch state]
      operationId: reportLocalPlayback
      summary: Report playback of a download on the device
      description: |
        Sent when the server can be reached, possibly long after (queued while offline). A report
        older than the title's last change (another device, a mark) is skipped. At most 500 per
        request.
      security:
        - bearer: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reports]
              properties:
                reports:
                  type: array
                  maxItems: 500
                  items:
                    $ref: '#/components/schemas/LocalReport'
      responses:
        '200':
          description: Per report, whether it was recorded.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LocalReportResults'
              examples:
                recorded:
                  $ref: examples/local-reports.json
        '400':
          description: The body isn't the reports (the text says how).
          content:
            text/plain:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: More than 500 reports.
          content:
            text/plain:
              schema:
                type: string
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/items/{id}/played:
    put:
      tags: [watch state]
